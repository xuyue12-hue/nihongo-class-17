<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>日本語学習システム</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;color:#263347;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}header{background:#fff;border-bottom:1px solid #e5e9f1;padding:18px max(18px,calc((100vw - 960px)/2));display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:19px;margin:0}h2{font-size:20px;margin:0 0 16px}h3{font-size:16px;margin:0 0 10px}small,.muted{color:#718096}.wrap{max-width:960px;margin:auto;padding:20px 16px 90px}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:18px}.tabs button{white-space:nowrap}button,.btn{border:0;border-radius:11px;padding:11px 15px;font-weight:650;background:#e9eef8;color:#32445f;cursor:pointer}button.primary{background:#496fe0;color:white}button.danger{background:#fff0f0;color:#ae3943}button.active{background:#496fe0;color:white}button:disabled{opacity:.5;cursor:not-allowed}.card{background:white;border:1px solid #e5eaf2;border-radius:17px;padding:18px;margin-bottom:14px;box-shadow:0 2px 9px #182a4c08}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.metric{background:#f2f5fc;border-radius:12px;padding:15px}.metric strong{font-size:26px;display:block}label{display:block;font-size:13px;font-weight:650;margin:12px 0 6px}input,select,textarea{width:100%;padding:12px;border:1px solid #dce3ed;border-radius:10px;background:white;font:inherit;font-size:15px}textarea{min-height:85px;resize:vertical}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.stack{display:flex;gap:8px;flex-wrap:wrap}.pill{display:inline-block;border-radius:100px;padding:5px 9px;background:#edf2ff;color:#4567b8;font-size:12px}.warn{background:#fff2dd;color:#9b651b}.ok{background:#e4f6ec;color:#238157}.question{padding:14px;border:1px solid #e2e8f2;border-radius:12px;margin:12px 0}.option{display:block;padding:10px;border:1px solid #e3e8f1;border-radius:9px;margin:7px 0;font-weight:400}.option input{width:auto;margin-right:8px}.hidden{display:none!important}.notice{background:#fff9e9;padding:12px;border-radius:11px;color:#855f23;font-size:13px;margin:10px 0}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e2e7ef;padding:10px;display:none}.bottom button{flex:1;font-size:12px;padding:10px 5px}@media(max-width:600px){header{padding:15px}h1{font-size:17px}.grid{grid-template-columns:repeat(2,1fr)}.wrap{padding:14px 12px 90px}.card{padding:15px}.bottom{display:flex}.desktopnav{display:none}.tabs{gap:6px}.tabs button{font-size:12px;padding:10px}.metric strong{font-size:22px}}
.auth{max-width:430px;margin:45px auto}.auth input{margin-bottom:12px}.logout{background:#fff0f0;color:#ae3943}.status{padding:12px;border-radius:10px;background:#eef4ff;margin:12px 0}.err{color:#b83243}.question label{font-weight:400}.wide{width:100%}.mutedtext{color:#718096;font-size:13px}header .stack{align-items:center}button{touch-action:manipulation} .card p{overflow-wrap:anywhere}

.editor-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.editor-grid label{margin:0}.editor-grid input{margin-top:5px}.editor-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.q-edit{background:#f7f9ff;border:1px solid #dce5fa;border-radius:13px;padding:15px;margin:12px 0}.q-edit .choice{display:flex;align-items:center;gap:7px;margin:7px 0}.q-edit .choice input[type=radio]{width:19px;flex:none}.q-edit .choice input[type=text]{flex:1;min-width:0}.q-list{display:flex;flex-direction:column;gap:9px}.q-list .question{margin:0}.q-list .question p{margin:6px 0}.compact{font-size:12px;padding:7px 10px}.sticky-publish{position:sticky;bottom:10px;background:white;padding:12px;border:1px solid #dce5fa;border-radius:12px;box-shadow:0 3px 14px #26334715;z-index:2}.batch-help{font-size:13px;color:#64748b;white-space:pre-line}@media(max-width:600px){.editor-grid{grid-template-columns:1fr}}

.study-tools{display:grid;grid-template-columns:1fr auto;gap:10px;margin-bottom:14px}.study-tools input{margin:0}.study-details summary{cursor:pointer;font-weight:650}.study-details[open] summary{margin-bottom:12px}@media(max-width:600px){.study-tools{grid-template-columns:1fr}} .written-item{padding:14px;border:1px solid #dfe6f1;border-radius:12px;margin:12px 0}.written-item textarea{min-height:65px}.written-tag{font-size:12px;background:#eef2ff;border-radius:8px;padding:4px 8px}.written-item input[type=number]{max-width:90px}.written-item .row{margin-top:9px} 

.reading-card{max-width:650px;margin:18px auto;padding:24px;border-radius:24px;background:#fff;border:1px solid #e1e7f1;box-shadow:0 8px 28px #23365b0b}.reading-word{text-align:center;font-size:clamp(34px,8vw,56px);font-weight:750;padding:52px 10px 42px;overflow-wrap:anywhere}.reading-options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.reading-option{min-height:90px;border:2px solid #e0e7f3;background:#fff;border-radius:17px;font-size:clamp(16px,4vw,21px);padding:14px 6px}.reading-option.selected{border-color:#496fe0;background:#edf2ff;color:#244ebd}.reading-progress{text-align:center;color:#64748b;font-size:14px}.reading-navigation{max-width:650px;margin:14px auto;display:flex;justify-content:space-between;gap:12px}.reading-navigation button{min-width:100px}.reading-review{font-size:14px;color:#53657e;text-align:center;margin-top:14px}@media(max-width:370px){.reading-card{padding:13px}.reading-options{gap:8px}.reading-option{min-height:76px}}
.mode-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px;margin-top:20px}.mode-tile{display:flex;flex-direction:column;align-items:flex-start;gap:12px;text-align:left;background:white;border:1px solid #dfe6f1;padding:28px;border-radius:19px;min-height:135px}.mode-tile strong{font-size:21px}.mode-tile small{font-size:13px;line-height:1.6}@media(max-width:600px){.mode-grid{grid-template-columns:1fr}.mode-tile{min-height:105px;padding:20px}}.learned-flashcard{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;width:100%;min-height:310px;margin:18px 0;border:1px solid #dce5fa;background:linear-gradient(145deg,#fff,#f1f5ff);border-radius:22px;box-shadow:0 5px 18px #253f7312;color:#263347}.learned-flashcard span{font-size:clamp(30px,8vw,55px);font-weight:750;overflow-wrap:anywhere}.learned-flashcard small{font-size:13px;color:#72819b}.reading-navigation{display:flex;justify-content:space-between;gap:12px}.reading-navigation button{flex:1}</style></head><body><div id="app"><div class="auth card">読み込み中...</div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=s=>new Date(s).toLocaleString('ja-JP',{timeZone:'Asia/Tokyo',dateStyle:'medium',timeStyle:'short'});
const closed=a=>Date.now()>new Date(a.deadline).getTime();
const cfgKey='nihongo_supabase_public_config';
let teacherMode='choice', writtenMode='vocab';
let cfg={url:'https://irnhlggwhwjitfohkxxi.supabase.co',key:'sb_publishable_JUtrHWkmTGrXre3HbVUVzA_D9DvEdAh'}, sb=null, user=null, profile=null,tab='home',materials=[],assignments=[],students=[],classes=[],members=[],submissions=[],writtenTests=[],writtenAnswers=[],questionsDraft=[],answerDraft={},opened=null,showAnswer=false,editingQuestion=-1;
const warn=e=>{console.error(e);alert(e?.message||String(e))};
function initClient(){if(!cfg?.url||!cfg?.key)return false;try{sb=window.supabase.createClient(cfg.url,cfg.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});return true}catch(e){warn(e);return false}}
async function boot(){if(!initClient()){showConfig();return}const {data:{session}}=await sb.auth.getSession();if(session)await loadUser();else showLogin();sb.auth.onAuthStateChange((_event,session)=>{if(!session){user=null;profile=null;showLogin()}})}
function showLogin(msg=''){$('app').innerHTML=`<div class="auth card"><h2>🌸 日本語学習システム</h2><p class="muted">中上級クラス · ログイン</p>${msg?`<p class="err">${esc(msg)}</p>`:''}<form id="login"><label>メールアドレス</label><input type="email" id="email" required autocomplete="username"><label>パスワード</label><input type="password" id="password" required autocomplete="current-password"><button class="primary wide" type="submit">ログイン</button></form><p class="mutedtext">アカウントは教師が発行します。</p></div>`;$('login').onsubmit=async e=>{e.preventDefault();let btn=e.target.querySelector('button');btn.disabled=true;let {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});btn.disabled=false;if(error)showLogin('ログインできませんでした。メールアドレスとパスワードを確認してください。');else await loadUser()}}
async function loadUser(){let {data:{user:u},error}=await sb.auth.getUser();if(error||!u){showLogin();return}user=u;let r=await sb.from('profiles').select('id,full_name,role').eq('id',u.id).single();if(r.error||!r.data){$('app').innerHTML='<div class="auth card"><h2>プロフィール未登録</h2><p>教師にアカウント登録を依頼してください。</p><button onclick="logout()">ログアウト</button></div>';return}profile=r.data;await refresh()}
async function logout(){await sb.auth.signOut();showLogin()}
async function refresh(){let rs=await Promise.all([sb.from('materials').select('*').order('created_at',{ascending:false}),sb.from('assignments').select('*').order('created_at',{ascending:false}),sb.from('classes').select('*'),sb.from('submissions').select('*')]);for(let r of rs)if(r.error){warn(r.error);return} [materials,assignments,classes,submissions]=rs.map(r=>r.data);if(profile.role==='teacher'){let [p,m]=await Promise.all([sb.from('profiles').select('id,full_name,role').order('full_name'),sb.from('class_members').select('*')]);if(p.error||m.error)return warn(p.error||m.error);students=p.data.filter(x=>x.role==='student');members=m.data}else{let m=await sb.from('class_members').select('class_id').eq('student_id',user.id);members=m.data||[];assignments=assignments.filter(a=>members.some(x=>x.class_id===a.class_id));let results=await sb.rpc('get_my_results');if(!results.error)submissions=results.data.map(x=>({...x,student_id:user.id,score:x.score,answers:x.answers}))}await loadWritten();render()}
const navs=()=>profile.role==='teacher'?[['home','ホーム'],['students','学生管理'],['materials','教材・問題'],['create','課題を作成'],['manage','課題管理'],['grades','成績管理']]:[['home','ホーム'],['study','言葉・文法'],['assignments','私の課題'],['learned','学んだ単語'],['grades','成績']];
function render(){let ns=navs();if(!ns.some(x=>x[0]===tab)&&!(profile.role==='teacher'&&['assignments','written'].includes(tab)))tab='home';$('app').innerHTML=`<header><div><h1>🌸 日本語学習システム</h1><small>${esc(profile.full_name)} · ${profile.role==='teacher'?'教師':'学生'}</small></div><button class="logout" onclick="logout()">ログアウト</button></header><main class="wrap"><nav class="tabs" id="nav">${ns.map(([k,t])=>`<button class="${tab===k?'active':''}" onclick="go('${k}')">${t}</button>`).join('')}</nav><section id="screen"></section></main><div class="bottom" id="bottom">${ns.slice(0,4).map(([k,t])=>`<button class="${tab===k?'active':''}" onclick="go('${k}')">${t}</button>`).join('')}</div>`;$('screen').innerHTML=profile.role==='teacher'?teacher():student();restoreTeacherDraft();configureTeacherMode()}
function go(k){tab=k;opened=null;render()}
function chooseTeacherMode(mode){questionsDraft=[];writtenDraft=[];teacherMode=mode;writtenMode=mode==='sentence'?'grammar':'vocab';tab=(mode==='written'||mode==='sentence')?'written':'assignments';render()}
function createTeacherHome(){return `<h2>課題を作成</h2><p class="mutedtext">問題の種類を選んでください。種類ごとに入力画面が分かれています。</p><div class="mode-grid">${[['written','記述問題','短い答えを入力する問題'],['choice','漢字の読み方','漢字をまとめて入力し、読み方の4択カードを作る'],['sentence','造文問題','文法を使って文を作る問題'],['meaning','意味を選ぶ問題','単語と4つの意味を登録する']].map(([k,n,d])=>`<button class="mode-tile" onclick="chooseTeacherMode('${k}')"><strong>${n}</strong><small>${d}</small></button>`).join('')}</div>`}
function configureTeacherMode(){
 if(profile?.role!=='teacher')return;
 if(tab==='written'){
  let grammar=writtenMode==='grammar',t=$('wType');
  if(t){t.value=grammar?'grammar':'vocab';t.disabled=true;writtenTypeChange()}
  let h=document.querySelector('#screen h2');if(h)h.textContent=grammar?'造文問題':'記述問題';
  let note=document.querySelector('#screen .notice');if(note)note.textContent=grammar?'学生が文法を使って造文します。教師が0～2点で採点します。':'学生が答えをひらがなで入力します。正解と照合して自動採点します。';
  if(t?.previousElementSibling)t.previousElementSibling.classList.add('hidden');
  let back=document.createElement('button');back.textContent='← 出題メニュー';back.onclick=()=>go('create');document.querySelector('#screen h2')?.after(back);
 }
 if(tab==='assignments'){
  const meaning=teacherMode==='meaning';let h=document.querySelector('#screen h2');
  if(h)h.textContent=meaning?'意味を選ぶ問題':'漢字の読み方';
  let back=document.createElement('button');back.textContent='← 出題メニュー';back.onclick=()=>go('create');h?.after(back);
  const reading=$('readingPanel'),batch=$('batchPanel'),editor=$('manualQuestionEditor');
  document.querySelector('[onclick="toggleBatch()"]')?.classList.add('hidden');batch?.classList.add('hidden');
  if(meaning){
   document.querySelector('[onclick="toggleReadingPanel()"]')?.classList.add('hidden');reading?.classList.add('hidden');
   const auto=document.querySelector('[onclick="autoQuestions()"]');if(auto)auto.textContent='登録済み教材から意味問題を作成';
   const qp=$('qp');if(qp)qp.placeholder='例：改善';
   if(qp?.previousElementSibling)qp.previousElementSibling.textContent='単語（漢字・語彙）';
   const opts=editor?.querySelector('label[for="meaningOptions"]');
   if(opts)opts.textContent='4つの意味（左の丸で正解を指定）';
   for(let i=0;i<4;i++)if($('o'+i))$('o'+i).placeholder=['正しい意味','別の意味 1','別の意味 2','別の意味 3'][i];
  }else{
   document.querySelector('[onclick="autoQuestions()"]')?.classList.add('hidden');
   editor?.classList.add('hidden');
   if(reading){reading.classList.remove('hidden')}
   document.querySelector('[onclick="toggleReadingPanel()"]')?.classList.add('hidden');
  }
 }
}
function teacher(){if(tab==='create')return createTeacherHome();if(tab==='manage')return manageTeacher();if(tab==='written')return writtenTeacher();if(tab==='home')return `<h2>教師ダッシュボード</h2><div class="grid"><div class="metric"><strong>${students.length}</strong>登録学生</div><div class="metric"><strong>${assignments.length}</strong>配信課題</div><div class="metric"><strong>${submissions.length}</strong>提出件数</div></div><div class="card"><h3>クラス管理</h3><p>学生名の変更、教材登録、課題の配信、提出状況の確認ができます。</p><button class="primary" onclick="go('create')">課題を作成</button></div>`;
if(tab==='students')return `<h2>学生管理</h2><div class="card"><p class="notice">ログインアカウントの新規作成は Supabase Authentication で行い、profiles と class_members に登録してください。氏名の編集はここからできます。</p>${students.map(s=>`<div class="row" style="padding:12px 0;border-top:1px solid #eee"><strong>${esc(s.full_name)}</strong><button onclick="rename('${s.id}')">氏名編集</button></div>`).join('')||'学生が登録されていません。'}</div>`;
if(tab==='materials')return `<h2>教材・問題</h2><div class="card"><h3>教材を追加</h3><label>種類</label><select id="mk"><option value="vocab">言葉</option><option value="grammar">文法</option></select><label>項目</label><input id="mt"><label>読み方・接続</label><input id="mr"><label>意味・説明</label><textarea id="mm"></textarea><label>例文</label><textarea id="me"></textarea><button class="primary" id="materialSaveButton" onclick="addMaterial()">教材を保存する</button><p id="materialSaveStatus" role="status" aria-live="polite"></p></div>${materials.map(m=>`<div class="card"><span class="pill">${m.kind==='vocab'?'言葉':'文法'}</span><h3>${esc(m.term)}</h3><small>${esc(m.reading)}</small><p>${esc(m.meaning)}</p><p>${esc(m.example)}</p><button class="danger" onclick="delMaterial('${m.id}')">削除</button></div>`).join('')}`;
if(tab==='assignments')return `<h2>課題配信</h2><div class="card"><h3>新しい課題</h3><div class="editor-grid"><div><label>配信クラス</label><select id="ac" onchange="saveTeacherDraft()">${classes.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div><div><label>課題名</label><input id="an" placeholder="例：N2 第1回" oninput="saveTeacherDraft()"></div></div><label>締切（日本時間）</label><input type="datetime-local" id="ad" onchange="saveTeacherDraft()"><div class="notice">提出は1回。正解と点数は締切後に公開されます。</div><div class="editor-actions"><button onclick="autoQuestions()">教材から問題を作成</button><button onclick="toggleBatch()">まとめて貼り付け</button><button class="primary" onclick="toggleReadingPanel()">漢字の読み方・一括出題</button><button class="danger" onclick="clearTeacherDraft()">草稿をクリア</button></div><div id="batchPanel" class="q-edit hidden"><h3>問題を一括追加</h3><p class="batch-help">1問につき6行（問題文、選択肢4行、正解番号）。問題同士は空行で区切ってください。</p><textarea id="batchText" style="min-height:180px" placeholder="「勉強」の意味は？&#10;学ぶこと&#10;寝ること&#10;遊ぶこと&#10;走ること&#10;1&#10;&#10;「早い」の反対は？&#10;遅い&#10;広い&#10;高い&#10;長い&#10;1"></textarea><button class="primary" onclick="importBatch()">一括追加</button></div><div id="readingPanel" class="q-edit hidden"><h3>漢字の読み方・一括出題</h3><p class="batch-help">漢字を1行に1語ずつ貼り付けてください。公開辞書を検索し、候補の読み方を取得します。検索できない語や複数の読みがある語は必ず確認してください。辞書サービスの接続状況により利用できない場合があります。</p><label>教材</label><select id="readingBook"><option>新完全マスター</option><option>日本語総まとめ</option><option>その他</option></select><label>課・範囲（任意）</label><input id="readingLesson" placeholder="例：N2 第3課"><label>単語一覧</label><textarea id="readingWords" style="min-height:145px" placeholder="改善&#10;承諾&#10;促進&#10;著しい&#10;適切"></textarea><div class="editor-actions"><button class="primary" id="readingLookupBtn" onclick="lookupReadings()">読み方を自動検索</button><button onclick="clearReadingPreview()">候補をクリア</button></div><p id="readingStatus" class="mutedtext"></p><div id="readingPreview"></div><button class="primary wide hidden" id="readingAddBtn" onclick="addReadingQuestions()">確認した問題を課題に追加</button></div><div class="q-edit" id="manualQuestionEditor"><h3 id="editorTitle">＋ 問題を追加</h3><label>問題文</label><textarea id="qp" placeholder="問題を入力してください" style="min-height:64px"></textarea><label for="meaningOptions">4つの意味（左の丸で正解を指定）</label>${[0,1,2,3].map(i=>`<div class="choice"><input type="radio" name="correct" value="${i}" ${i===0?'checked':''} aria-label="選択肢${i+1}が正解"><input type="text" id="o${i}" placeholder="選択肢 ${i+1}"></div>`).join('')}<details><summary>解説を追加（任意）</summary><textarea id="qe" placeholder="解説"></textarea></details><div class="editor-actions"><button class="primary" onclick="addQuestion()" id="addQBtn">＋ 追加して次の問題へ</button><button onclick="resetQuestionEditor()">入力をクリア</button></div></div><div class="row"><h3>作成中：<span id="qCount">${questionsDraft.length}</span>問</h3><small>編集・複製・削除できます</small></div><div class="q-list" id="draftList">${draftQuestionList()}</div><div class="sticky-publish"><button class="primary wide" onclick="publish()">${questionsDraft.length}問を課題として配信</button></div></div><h3>配信済み</h3>${assignments.map(a=>`<div class="card"><strong>${esc(a.title)}</strong><p>締切：${fmt(a.deadline)} · ${closed(a)?'締切終了':'受付中'}</p></div>`).join('')}`;
if(tab==='grades')return `<h2>成績管理</h2>${assignments.map(a=>`<div class="card"><h3>${esc(a.title)}</h3><small>締切：${fmt(a.deadline)}</small>${students.filter(s=>members.some(m=>m.student_id===s.id&&m.class_id===a.class_id)).map(s=>{let r=submissions.find(x=>x.student_id===s.id&&x.assignment_id===a.id);return `<div class="row" style="border-top:1px solid #eee;padding:10px 0"><strong>${esc(s.full_name)}</strong><span>${r?`${r.score}点 · 提出済み`:'未提出'}</span></div>`}).join('')}</div>`).join('')||'<div class="card">課題がありません。</div>'}`}
async function rename(id){let s=students.find(x=>x.id===id),name=prompt('新しい氏名',s.full_name);if(!name?.trim())return;let r=await sb.rpc('update_student_name',{p_student_id:id,p_new_name:name.trim()});if(r.error)return warn(r.error);await refresh()}
async function addMaterial(){
 const btn=$('materialSaveButton'),status=$('materialSaveStatus');
 const term=$('mt')?.value.trim(),meaning=$('mm')?.value.trim();
 if(!term||!meaning){if(status)status.textContent='項目と意味・説明を入力してください。';return;}
 if(!sb){if(status)status.textContent='データベースに接続されていません。';return;}

let readingCandidates=[];

const kanaOnly=s=>/^[ぁ-ゖー・\s]+$/.test(s);
function readingOptions(reading,pool){let options=[reading];for(const r of pool){if(r&&r!==reading&&!options.includes(r))options.push(r);if(options.length===4)break;}return options;}
// ブラウザ内形態素解析：外部の辞書APIを直接呼ばない方式。
let readingTokenizerPromise=null;
function katakanaToHiragana(s){return String(s||'').replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-96));}
function loadReadingTokenizer(){
 if(readingTokenizerPromise)return readingTokenizerPromise;
 readingTokenizerPromise=new Promise((resolve,reject)=>{
  const start=()=>{
   try{window.kuromoji.builder({dicPath:'https://cdn.jsdelivr.net/npm/kuromoji@0.1.2/dict/'}).build((err,tokenizer)=>err?reject(err):resolve(tokenizer));}
   catch(e){reject(e)}
  };
  if(window.kuromoji)return start();
  const script=document.createElement('script');
  script.src='https://cdn.jsdelivr.net/npm/kuromoji@0.1.2/build/kuromoji.js';
  script.onload=start;script.onerror=()=>reject(new Error('日本語辞書のプログラムを読み込めませんでした'));
  document.head.appendChild(script);
 }).catch(e=>{readingTokenizerPromise=null;throw e});
 return readingTokenizerPromise;
}
function tokenizerReading(tokenizer,word){
 const tokens=tokenizer.tokenize(word);
 if(!tokens.length)return '';
 let result='';
 for(const token of tokens){
  if(token.reading&&token.reading!=='*')result+=katakanaToHiragana(token.reading);
  else if(/^[ぁ-ゖァ-ヶー]+$/.test(token.surface_form))result+=katakanaToHiragana(token.surface_form);
  else return '';
 }
 return kanaOnly(result)?result:'';
}
async function lookupReadings(){
 const words=[...new Set(($('readingWords')?.value||'').split(/[\n、,，]+/).map(x=>x.trim()).filter(Boolean))];
 if(!words.length)return alert('単語を入力してください');
 if(words.length>100)return alert('一度に100語まで入力してください');
 const btn=$('readingLookupBtn');btn.disabled=true;readingCandidates=[];
 let tokenizer=null,error=null;
 try{
  $('readingStatus').textContent='日本語辞書を読み込んでいます。初回は少し時間がかかります…';
  try{tokenizer=await Promise.race([loadReadingTokenizer(),new Promise((_,reject)=>setTimeout(()=>reject(new Error('辞書の読み込みが25秒を超えました。ネットワークを確認してください。')),25000))])}catch(e){error=e;console.warn('辞書読み込み失敗',e)}
  for(let i=0;i<words.length;i++){
   const word=words[i],reading=tokenizer?tokenizerReading(tokenizer,word):'';
   readingCandidates.push({word,reading,alternatives:reading?[reading]:[],checked:false});
  }
  drawReadingPreview();
  const filled=readingCandidates.filter(q=>q.reading).length;
  $('readingStatus').textContent=error
   ?'辞書を読み込めませんでした。GitHub Pages（https://）で開いて再試行してください。詳細：'+(error.message||error)
   :`${words.length}語中${filled}語の読み方を自動入力しました。候補は必ず確認してください。`;
 }finally{btn.disabled=false}
}
function drawReadingPreview(){
 const el=$('readingPreview');if(!el)return;
 el.innerHTML=readingCandidates.map((q,i)=>`<div class="written-item"><div class="row"><strong>${i+1}. ${esc(q.word)}</strong><span class="pill ${q.reading&&q.alternatives.length===1?'ok':'warn'}">${q.reading&&q.alternatives.length===1?'候補あり':'要確認'}</span></div>${q.alternatives.length>1?`<small>辞書候補：${q.alternatives.map(esc).join(' / ')}</small>`:''}<label>正しい読み方（ひらがな）</label><input id="readingValue${i}" value="${esc(q.reading)}" placeholder="読み方を入力・修正" oninput="readingCandidates[${i}].checked=false;document.getElementById('readingCheck${i}').checked=false"><label class="option"><input type="checkbox" id="readingCheck${i}" ${q.checked?'checked':''} onchange="readingCandidates[${i}].checked=this.checked">読み方を確認しました</label></div>`).join('');
 $('readingAddBtn').classList.toggle('hidden',!readingCandidates.length);
}
function makeDistractors(reading,allReadings){
 const out=[];const add=v=>{if(v&&v!==reading&&kanaOnly(v)&&!out.includes(v))out.push(v)};
 // 他の単語の読みを先に使い、足りない場合は音の近い候補を生成する。
 // 他の問題の正解をそのまま流用しない（無関係な選択肢を防ぐ）。
 const chars=[...reading];
 const replacements=[['か','が'],['が','か'],['し','じ'],['じ','し'],['た','だ'],['だ','た'],['き','ぎ'],['ぎ','き'],['せ','ぜ'],['ぜ','せ'],['つ','っ'],['っ','つ'],['ん','う'],['う','ん'],['く','ぐ'],['ぐ','く'],['は','ば'],['ば','は']];
 for(let i=0;i<chars.length;i++)for(const [a,b] of replacements)if(chars[i]===a){let c=chars.slice();c[i]=b;add(c.join(''));}
 for(let i=0;i<chars.length&&out.length<3;i++)for(const c of ['か','し','つ','ん','う','く','き','せ','た']){let x=chars.slice();x[i]=c;add(x.join(''));if(out.length>=3)break;}
 return out.slice(0,3);
}
function addReadingQuestions(){
 if(!readingCandidates.length)return;
 const values=readingCandidates.map((q,i)=>({word:q.word,reading:($('readingValue'+i)?.value||'').trim().normalize('NFKC'),checked:$('readingCheck'+i)?.checked}));
 const bad=values.findIndex(x=>!x.checked||!kanaOnly(x.reading));
 if(bad>=0)return alert(`${bad+1}番の読み方をひらがなで入力し、「確認しました」にチェックしてください。`);
 const all=values.map(x=>x.reading),questions=[];
 for(let i=0;i<values.length;i++){
  const q=values[i],other=makeDistractors(q.reading,all.filter((_,j)=>j!==i));
  if(other.length<3||new Set([q.reading,...other]).size!==4)return alert(`${i+1}番の選択肢を作成できませんでした。手動で問題を作成してください。`);
  const options=[q.reading,...other];
  // 選択肢の正解位置を分散
  const shift=i%4;for(let j=0;j<shift;j++)options.push(options.shift());
  questions.push({prompt:q.word,options,answer:options.indexOf(q.reading),explanation:`[READING_CARD] ${$('readingBook').value} ${$('readingLesson').value.trim()}｜${q.word}：${q.reading}`});
 }
 questionsDraft.push(...questions);saveTeacherDraft();updateQuestionList();clearReadingPreview();
 alert(`${questions.length}問を追加しました。下の「作成中」で選択肢を確認・編集してから配信してください。`);
 $('draftList').scrollIntoView({behavior:'smooth'});
}

async function loadLearnedWords(){
 if(learnedBusy)return;learnedBusy=true;let area=$('learnedArea');if(area)area.innerHTML='<div class="card">単語を読み込んでいます...</div>';
 try{
  const eligible=assignments.filter(a=>closed(a)&&mySub(a.id));const found=new Map();let failures=0;
  for(const a of eligible){
   const r=await sb.rpc('get_assignment_questions',{p_assignment:a.id});if(r.error){failures++;continue;}
   for(const q of r.data||[]){if(!isReadingCard(q))continue;
    const word=String(q.prompt||'').trim();const reading=q.options?.[q.answer];
    if(word&&reading&&!found.has(word+'|'+reading))found.set(word+'|'+reading,{word,reading,title:a.title});
   }
  }
  learnedCache=[...found.values()];learnedIndex=0;learnedFlipped=false;
  if($('learnedArea'))$('learnedArea').innerHTML=(failures?`<p class="notice">${failures}件の課題は読み込めませんでした。</p>`:'')+learnedCardHtml();
 }catch(e){warn(e)}finally{learnedBusy=false}
}

function isReadingCard(q){
  if(String(q.explanation||'').startsWith('[MEANING_CHOICE]'))return false;
 // 旧版で配信された読み方問題もカード表示する（タグがない問題を含む）。
 if(String(q.explanation||'').startsWith('[READING_CARD]'))return true;
 const prompt=String(q.prompt||'').trim();
 const opts=Array.isArray(q.options)?q.options:[];
 const bare=prompt.replace(/[「」『』\s]/g,'').replace(/の読み方として正しいものを選んでください[。．.]?/g,'').replace(/の読み方は[？?]?/g,'');
 return /[一-龯々〆ヵヶ]/.test(bare)&&opts.length===4&&opts.every(x=>/^[ぁ-ゖァ-ヺー\s]+$/.test(String(x||'').trim()));
}
function readingWord(q){return String(q.prompt||'').trim().replace(/^「([^」]+)」の読み方として正しいものを選んでください[。．.]?$/,'$1').replace(/^「([^」]+)」の読み方は[？?]?$/,'$1')}

function drawAssignment(){
 let {a,qs,review}=opened;
 if(qs.length&&qs.every(isReadingCard))return drawReadingCard();
 $('screen').innerHTML=`<div class="row"><h2>${esc(a.title)}</h2><button onclick="render()">戻る</button></div><div class="notice">${review?'締切後の正解・解説です。':'回答はこの端末に一時保存されます。提出は1回です。'}</div>${qs.map((q,i)=>`<div class="card"><h3>問題 ${i+1}</h3><p>${esc(q.prompt)}</p>${q.options.map((o,j)=>`<label class="option"><input type="radio" name="q${i}" ${answerDraft[q.id]===j?'checked':''} ${review?'disabled':''} onchange="saveAnswer('${q.id}',${j})">${esc(o)}</label>`).join('')}${review?`<p><strong>正解：${esc(q.options[q.answer])}</strong></p><small>${esc(q.explanation)}</small>`:''}</div>`).join('')}${review?'':`<button class="primary wide" onclick="submitNow()">提出する</button>`}`;
}
function drawReadingCard(){
 const {a,qs,review}=opened;
 const i=Math.max(0,Math.min(opened.cardIndex||0,qs.length-1));opened.cardIndex=i;
 const q=qs[i],selected=answerDraft[q.id];
 $('screen').innerHTML=`<div class="row"><h2>${esc(a.title)}</h2><button onclick="render()">戻る</button></div><p class="reading-progress">問題 ${i+1} / ${qs.length}　・　回答済み ${qs.filter(x=>answerDraft[x.id]!==undefined).length}問</p><div class="reading-card"><div class="reading-word">${esc(readingWord(q))}</div><div class="reading-options">${q.options.map((o,j)=>`<button class="reading-option ${selected===j?'selected':''}" ${review?'disabled':''} onclick="chooseReadingCard(${j})">${esc(o)}</button>`).join('')}</div>${review?`<p class="reading-review">正解：${esc(q.options[q.answer])}</p>`:''}</div><div class="reading-navigation"><button ${i===0?'disabled':''} onclick="moveReadingCard(-1)">前へ</button>${i===qs.length-1?(review?'<button disabled>最後の問題</button>':'<button class="primary" onclick="submitNow()">提出する</button>'):`<button class="primary" onclick="moveReadingCard(1)">次へ</button>`}</div>`;
}
function chooseReadingCard(j){if(!opened||opened.review)return;const q=opened.qs[opened.cardIndex];saveAnswer(q.id,j);drawReadingCard()}
function moveReadingCard(delta){if(!opened)return;opened.cardIndex=Math.max(0,Math.min(opened.qs.length-1,opened.cardIndex+delta));drawReadingCard()}

function saveAnswer(id,v){answerDraft[id]=v;localStorage.setItem('draft_'+user.id+'_'+opened.a.id,JSON.stringify(answerDraft))}
async function submitNow(){let {a,qs}=opened;if(closed(a))return alert('締切終了');let missing=qs.filter(q=>answerDraft[q.id]===undefined).length;if(missing&&!confirm(`未回答が${missing}問あります。提出しますか？`))return;if(!confirm('提出後は変更できません。提出しますか？'))return;let r=await sb.rpc('submit_assignment',{p_assignment:a.id,p_answers:answerDraft});if(r.error)return warn(r.error);localStorage.removeItem('draft_'+user.id+'_'+a.id);opened=null;tab='assignments';await refresh();alert('提出しました！')}

t(t.deadline)} / ${closed(t)?'締切終了':'受付中'}</p></div>`).join('')||'<div class="card">まだありません。</div>'}<div id="wResults"></div>`}

function writtenUpdate(){$('wDraftList').innerHTML=writtenDraftList();document.querySelector('#wDraftList').previousElementSibling.textContent=`作成中：${writtenDraft.length}問`}

function writtenAdd(){let kind=$('wType').value,prompt=$('wPrompt').value.trim(),expected=$('wExpected').value.trim(),explanation=$('wExplain').value.trim();if(!prompt||(kind==='vocab'&&!expected))return alert('問題文と正解を入力してください');let q={kind,prompt,expected:kind==='vocab'?expected:'',explanation};if(writtenEditing<0)writtenDraft.push(q);else writtenDraft[writtenEditing]=q;writtenReset();persistWritten();writtenUpdate();$('wPrompt').focus()}
function writtenEdit(i){let q=writtenDraft[i];if(q.kind!==(writtenMode==='grammar'?'grammar':'vocab'))return alert('この問題は別の出題ページで編集してください。');writtenEditing=i;$('wType').value=q.kind;$('wPrompt').value=q.prompt;$('wExpected').value=q.expected;$('wExplain').value=q.explanation;writtenTypeChange();$('wEditTitle').textContent=`問題 ${i+1} を編集`;$('wPrompt').scrollIntoView({behavior:'smooth'})}
function writtenDuplicate(i){writtenDraft.splice(i+1,0,{...writtenDraft[i]});persistWritten();writtenUpdate()}

async function writtenPublish(){
 let title=$('wtTitle').value.trim(),deadline=$('wtDeadline').value,cls=Number($('wtClass').value);
 if(!title||!deadline||!writtenDraft.length)return alert('テスト名、締切、問題を入力してください');
 if(!Number.isFinite(new Date(deadline).getTime()))return alert('日時を確認してください');
 if(!writtenPublishedEditing&&new Date(deadline)<=new Date())return alert('締切は未来にしてください');
 if(writtenPublishedEditing){
  const id=writtenPublishedEditing.id;
  const count=writtenAnswers.filter(a=>a.test_id===id).length;
  if(count){
   const original=writtenTests.find(t=>t.id===id);
   if(cls!==Number(original.class_id)||JSON.stringify(writtenDraft)!==JSON.stringify(original.questions))return alert('提出済みのため、問題とクラスは変更できません');
  }
  if(!confirm('変更を保存しますか？'))return;
  const update={title,class_id:cls,deadline:new Date(deadline).toISOString()};

  if(r.error)return warn(r.error);
  if(!r.data?.length)return alert('更新できませんでした。Supabaseの権限を確認してください。');
  writtenPublishedEditing=null;writtenDraft=[];localStorage.removeItem(writtenKey());await refresh();alert('変更を保存しました');return;
 }
 if(!confirm(`${writtenDraft.length}問を配信しますか？`))return;
 let r=await sb.from('written_tests').insert({title,class_id:cls,deadline:new Date(deadline).toISOString(),questions:writtenDraft,created_by:user.id});
 if(r.error)return warn(r.error);writtenDraft=[];localStorage.removeItem(writtenKey());await refresh();alert('配信しました')
}
function writtenStudent(){return `<h2>記述式テスト</h2>${writtenTests.map(t=>{let a=writtenAnswers.find(x=>x.test_id===t.id&&x.student_id===user.id);return `<div class="card"><div class="row"><strong>${esc(t.title)}</strong><span class="pill">${a?'提出済み':closed(t)?'締切終了':'未提出'}</span></div><p class="mutedtext">締切：${fmt(t.deadline)}</p>${a?(closed(t)?`<button onclick="writtenReview('${t.id}')">結果・解説を見る</button>`:'締切後に採点結果を公開します。'):!closed(t)?`<button class="primary" onclick="writtenOpen('${t.id}')">回答する</button>`:''}</div>`}).join('')||'<div class="card">現在、テストはありません。</div>'}<div id="wStudentForm"></div>`}
function writtenOpen(id){let t=writtenTests.find(x=>x.id===id);if(!t||closed(t)||writtenAnswers.some(x=>x.test_id===id&&x.student_id===user.id))return;let saved=JSON.parse(localStorage.getItem('written_answers_'+user.id+'_'+id)||'{}');$('wStudentForm').innerHTML=`<div class="card"><h3>${esc(t.title)}</h3><p class="notice">入力内容はこの端末に一時保存されます。提出後は変更できません。</p>${t.questions.map((q,i)=>`<div class="written-item"><strong>問題 ${i+1}｜${q.kind==='vocab'?'読み方':'文法・作文'}</strong><p>${esc(q.prompt)}</p>${q.kind==='vocab'?`<input id="wa${i}" value="${esc(saved[i]||'')}" placeholder="ひらがなで入力" oninput="writtenSaveLocal('${id}')">`:`<textarea id="wa${i}" placeholder="文を作ってください" oninput="writtenSaveLocal('${id}')">${esc(saved[i]||'')}</textarea>`}</div>`).join('')}<button class="primary wide" id="writtenSubmitBtn" onclick="writtenSubmit('${id}')">提出する</button></div>`;$('wStudentForm').scrollIntoView({behavior:'smooth'})}
function writtenSaveLocal(id){let t=writtenTests.find(x=>x.id===id),answers={};t.questions.forEach((q,i)=>answers[i]=$('wa'+i)?.value||'');localStorage.setItem('written_answers_'+user.id+'_'+id,JSON.stringify(answers))}
const normalizeKana=x=>String(x||'').normalize('NFKC').trim().replace(/\s/g,'').replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-96));
let writtenSubmitting=false;
async function writtenSubmit(id){
 if(writtenSubmitting)return;
 const t=writtenTests.find(x=>x.id===id);
 if(!t)return alert('テストが見つかりません。画面を更新してください。');
 if(closed(t))return alert('締切終了');
 const answers=t.questions.map((q,i)=>document.getElementById('wa'+i)?.value.trim()??'');
 writtenSaveLocal(id);
 if(answers.some(x=>!x)&&!confirm('未回答があります。提出しますか？'))return;
 if(!confirm('提出後は変更できません。提出しますか？'))return;
 const btn=document.getElementById('writtenSubmitBtn');
 writtenSubmitting=true;
 if(btn){btn.disabled=true;btn.textContent='提出中...';}
 try{
  const r=await sb.rpc('submit_written_test',{p_test_id:id,p_answers:answers});
  if(r.error)throw r.error;
  // 提出の確定をサーバーから再取得して確認する。
  const check=await sb.from('written_answers').select('id').eq('test_id',id).eq('student_id',user.id).limit(1);
  if(check.error)console.warn('提出確認の読み取りに失敗',check.error);
  else if(!check.data?.length)throw new Error('提出の確認ができませんでした。教師に提出状況を確認してもらってください。');
  localStorage.removeItem('written_answers_'+user.id+'_'+id);
  await refresh();
  alert('提出しました！');
 }catch(e){
  console.error('記述式提出エラー',e);
  const message=e?.message||String(e);
  alert('提出できませんでした。入力内容はこの端末に保存されています。\n\nエラー：'+message+'\n\nこの画面を撮影して先生に送ってください。');
 }finally{
  writtenSubmitting=false;
  if(btn?.isConnected){btn.disabled=false;btn.textContent='提出する';}
 }
}
function writtenReview(id){let t=writtenTests.find(x=>x.id===id),a=writtenAnswers.find(x=>x.test_id===id&&x.student_id===user.id);if(!t||!a||!closed(t))return;let total=a.grades.reduce((s,g)=>s+(g||0),0),max=t.questions.reduce((s,q)=>s+(q.kind==='vocab'?1:2),0);$('wStudentForm').innerHTML=`<div class="card"><h3>${esc(t.title)}｜${a.grades.includes(null)?'採点中':total+' / '+max+' 点'}</h3>${t.questions.map((q,i)=>`<div class="written-item"><strong>${i+1}. ${esc(q.prompt)}</strong><p>回答：${esc(a.answers[i]||'（未回答）')}</p><p>得点：${a.grades[i]===null?'教師確認待ち':a.grades[i]+' / '+(q.kind==='vocab'?1:2)}</p><small>参考：${esc(q.kind==='vocab'?q.expected:q.explanation||'解説なし')}</small></div>`).join('')}</div>`;$('wStudentForm').scrollIntoView({behavior:'smooth'})}

function writtenGrade(id,studentId){let t=writtenTests.find(x=>x.id===id),a=writtenAnswers.find(x=>x.test_id===id&&x.student_id===studentId),st=students.find(x=>x.id===studentId);if(!t||!a)return;$('wResults').innerHTML=`<div class="card"><div class="row"><h3>${esc(st?.full_name||'学生')}｜${esc(t.title)}</h3><button onclick="writtenResults('${id}')">一覧に戻る</button></div>${t.questions.map((q,i)=>`<div class="written-item"><strong>問題 ${i+1}｜${q.kind==='vocab'?'語彙':'作文'}</strong><p>${esc(q.prompt)}</p><p>学生の回答：<strong>${esc(a.answers[i]||'（未回答）')}</strong></p>${q.kind==='vocab'?`<small>正解：${esc(q.expected)} / ${a.grades[i]}点</small>`:`<p class="mutedtext">模範文・解説：${esc(q.explanation||'なし')}</p><label>教師採点（0～2点）</label><select id="wg${i}"><option value="" ${a.grades[i]===null?'selected':''}>未採点</option>${[0,1,2].map(n=>`<option value="${n}" ${a.grades[i]===n?'selected':''}>${n}点</option>`).join('')}</select>`}</div>`).join('')}<button class="primary wide" onclick="writtenSaveGrades('${id}','${studentId}')">採点を保存</button></div>`;$('wResults').scrollIntoView({behavior:'smooth'})}

function writtenEditPublished(id){

 if(writtenPublishedEditing||writtenDraft.length||$('wtTitle')?.value.trim()){
  if(!confirm('現在の編集中の内容を破棄して、このテストを編集しますか？'))return;
 }
 const count=writtenAnswers.filter(a=>a.test_id===id).length;

 writtenDraft=JSON.parse(JSON.stringify(t.questions));writtenEditing=-1;
 $('wtTitle').value=t.title;

 const date=new Date(t.deadline);

 $('wtClass').disabled=count>0;
 document.querySelector('.written-item').classList.toggle('hidden',count>0);
 $('wDraftList').classList.toggle('hidden',count>0);
 $('writtenPublishBtn').textContent='変更を保存';
 $('writtenCancelBtn').classList.remove('hidden');
 writtenUpdate();
 $('writtenFormHeading').scrollIntoView({behavior:'smooth'});
}
function writtenCancelPublishedEdit(){
 writtenPublishedEditing=null;writtenDraft=[];writtenEditing=-1;
 localStorage.removeItem(writtenKey());render();
}
async function writtenDeletePublished(id){
 if(profile.role!=='teacher')return;
 const t=writtenTests.find(x=>x.id===id);if(!t)return;
 const count=writtenAnswers.filter(a=>a.test_id===id).length;
 if(count)return alert(`${count}件の提出があります。学生の回答と成績を保護するため削除できません。`);
 if(!confirm(`「${t.title}」を削除しますか？この操作は取り消せません。`))return;
 const r=await sb.from('written_tests').delete().eq('id',id).select('id');
 if(r.error)return warn(r.error);
 if(!r.data?.length)return alert('削除できませんでした。Supabaseの権限を確認してください。');
 if(writtenPublishedEditing?.id===id)writtenPublishedEditing=null;
 await refresh();alert('削除しました');
}

// 統合課題管理（既存データを保護する）
function manageTeacher(){
 const all=[...assignments.map(a=>({...a,_type:'choice'})),...writtenTests.map(t=>({...t,_type:'written'}))].sort((a,b)=>new Date(b.created_at||0)-new Date(a.created_at||0));
 return `<h2>課題管理</h2><p class="mutedtext">配信済みの選択式課題と記述式テストをまとめて管理できます。</p><div id="manageDetail"></div>${all.map(a=>{
 const written=a._type==='written',count=written?writtenAnswers.filter(x=>x.test_id===a.id).length:submissions.filter(x=>x.assignment_id===a.id).length;
 return `<div class="card"><div class="row"><strong>${esc(a.title)}</strong><span class="pill">${written?'記述式':'選択式'}</span></div><p class="mutedtext">締切：${fmt(a.deadline)} · ${closed(a)?'締切終了':'受付中'} · 提出 ${count}件</p><div class="stack"><button onclick="manageView('${a._type}','${a.id}')">詳細を見る</button><button onclick="manageEdit('${a._type}','${a.id}')">編集</button><button onclick="manageSubmissions('${a._type}','${a.id}')">提出状況</button><button class="danger" onclick="manageDelete('${a._type}','${a.id}')">削除</button></div></div>`}).join('')||'<div class="card">配信済み課題はありません。</div>'}`;
}
function manageShow(html){$('manageDetail').innerHTML=`<div class="card"><div class="row"><h3>課題詳細</h3><button onclick="$('manageDetail').innerHTML=''">閉じる</button></div>${html}</div>`;$('manageDetail').scrollIntoView({behavior:'smooth',block:'start'});}
async function manageView(type,id){
 if(profile.role!=='teacher')return;
 if(type==='written'){
  const t=writtenTests.find(x=>x.id===id);if(!t)return;
  manageShow(`<h3>${esc(t.title)}</h3><p>締切：${fmt(t.deadline)}</p>${t.questions.map((q,i)=>`<div class="written-item"><strong>問題 ${i+1}｜${q.kind==='vocab'?'語彙':'作文'}</strong><p>${esc(q.prompt)}</p><p>正解・模範：${esc(q.kind==='vocab'?q.expected:q.explanation||'未設定')}</p></div>`).join('')}`);return;
 }
 const a=assignments.find(x=>x.id===id);if(!a)return;
 // 選択式の問題取得は既存RPCの権限に依存。取得できなければ情報のみ表示する。
 const r=await sb.rpc('get_assignment_questions',{p_assignment:id});
 const qs=!r.error&&Array.isArray(r.data)?r.data:[];
 manageShow(`<h3>${esc(a.title)}</h3><p>締切：${fmt(a.deadline)}</p>${r.error?'<p class="notice">問題の詳細は現在のデータベース権限では取得できません。</p>':qs.map((q,i)=>`<div class="question"><strong>問題 ${i+1}：${esc(q.prompt)}</strong>${Array.isArray(q.options)?`<p>${q.options.map((o,j)=>`${j+1}. ${esc(o)}`).join(' / ')}</p>`:''}${Number.isInteger(q.answer)?`<p>正解：${esc(q.options?.[q.answer]||'')}</p>`:''}<small>${esc(q.explanation||'')}</small></div>`).join('')}`);
}
async function manageEdit(type,id){
 if(profile.role!=='teacher')return;
 if(type==='written'){let t=writtenTests.find(x=>x.id===id);writtenMode=t?.questions?.[0]?.kind==='grammar'?'grammar':'vocab';go('written');writtenEditPublished(id);return;}
 const a=assignments.find(x=>x.id===id);if(!a)return;
 const count=submissions.filter(x=>x.assignment_id===id).length;
 const r=await sb.rpc('get_assignment_questions',{p_assignment:id});
 if(r.error || !Array.isArray(r.data)){
  manageShow(`<h3>${esc(a.title)}｜編集</h3><p class="notice">問題を取得できません。データベースの教師用閲覧権限を確認してください。</p><p>${esc(r.error?.message||'問題データがありません')}</p>`);return;
 }
 manageChoiceDraft={id,questions:JSON.parse(JSON.stringify(r.data)),original:JSON.parse(JSON.stringify(r.data)),locked:count>0};
 manageDrawChoiceEditor();
}
let manageChoiceDraft=null;
function manageDrawChoiceEditor(){
 const d=manageChoiceDraft;if(!d)return;
 const a=assignments.find(x=>x.id===d.id);if(!a)return;
 const date=new Date(a.deadline);
 const local=new Date(date.getTime()-date.getTimezoneOffset()*60000).toISOString().slice(0,16);
 manageShow(`<h3>${esc(a.title)}｜編集</h3><p class="notice">${d.locked?'提出済みの回答があるため、問題内容・正解は変更できません。名称と締切のみ変更できます。':'問題文、選択肢、正解、解説を編集できます。保存するまで学生には反映されません。'}</p>
 <label>課題名</label><input id="manageTitle" value="${esc(a.title)}">
 <label>締切</label><input type="datetime-local" id="manageDeadline" value="${local}">
 <h3 style="margin-top:20px">問題内容（${d.questions.length}問）</h3>
 ${d.questions.map((q,i)=>`<div class="q-edit"><h3>問題 ${i+1}</h3><label>問題文</label><textarea id="mcPrompt${i}" ${d.locked?'disabled':''}>${esc(q.prompt)}</textarea><label>選択肢（正解の丸を選択）</label>${(q.options||[]).map((o,j)=>`<div class="choice"><input type="radio" name="mcAnswer${i}" value="${j}" ${Number(q.answer)===j?'checked':''} ${d.locked?'disabled':''}><input type="text" id="mcOpt${i}_${j}" value="${esc(o)}" ${d.locked?'disabled':''}></div>`).join('')}<label>解説</label><textarea id="mcExplain${i}" ${d.locked?'disabled':''}>${esc(q.explanation||'')}</textarea></div>`).join('')}
 <div class="stack"><button class="primary" onclick="manageSaveChoice('${d.id}')">変更を保存</button><button onclick="go('manage')">キャンセル</button></div>`);
}
async function manageSaveChoice(id){
 const d=manageChoiceDraft;
 if(!d||d.id!==id)return;
 const title=$('manageTitle')?.value.trim(),raw=$('manageDeadline')?.value,date=new Date(raw);
 if(!title||!raw||!Number.isFinite(date.getTime()))return alert('課題名と正しい締切を入力してください');
 const changes=[];
 if(!d.locked){
  for(let i=0;i<d.questions.length;i++){
   const q=d.questions[i],prompt=$('mcPrompt'+i).value.trim(),options=(q.options||[]).map((_,j)=>$('mcOpt'+i+'_'+j).value.trim());
   const answer=Number(document.querySelector(`input[name="mcAnswer${i}"]:checked`)?.value);
   const explanation=$('mcExplain'+i).value.trim();
   if(!prompt||options.some(x=>!x)||!Number.isInteger(answer)||answer<0||answer>=options.length)return alert(`問題 ${i+1} の入力を確認してください`);
   if(!q.id)return alert('問題IDが取得できません。保存できません。');
   const updated={prompt,options,answer,explanation};
   if(JSON.stringify(updated)!==JSON.stringify({prompt:q.prompt,options:q.options,answer:q.answer,explanation:q.explanation||''}))changes.push({id:q.id,...updated});
  }
 }
 if(!confirm(`課題情報${changes.length?'と問題 '+changes.length+' 件':''}を更新しますか？`))return;
 // 問題の更新は専用の教師用RPCを使用し、学生の採点権限とは分離する。
 if(changes.length){
  const r=await sb.rpc('teacher_update_assignment_questions',{p_assignment:id,p_questions:changes});
  if(r.error)return alert('問題の更新に失敗しました。教師用SQLの設定を確認してください。\n'+r.error.message);
 }
 const r=await sb.from('assignments').update({title,deadline:date.toISOString()}).eq('id',id).select('id');
 if(r.error)return warn(r.error);
 if(!r.data?.length)return alert('課題名・締切を更新できません。Supabaseの権限を確認してください。');
 manageChoiceDraft=null;await refresh();alert('変更を保存しました');
}
function manageSubmissions(type,id){
 if(type==='written'){go('written');writtenResults(id);return;}
 const a=assignments.find(x=>x.id===id);if(!a)return;
 const enrolled=students.filter(st=>members.some(m=>m.student_id===st.id&&m.class_id===a.class_id));
 manageShow(`<h3>${esc(a.title)}｜提出状況</h3>${enrolled.map(st=>{const r=submissions.find(x=>x.assignment_id===id&&x.student_id===st.id);return `<div class="row" style="padding:10px 0;border-bottom:1px solid #eee"><strong>${esc(st.full_name)}</strong><span>${r?`${esc(r.score)}点・提出済み`:'未提出'}</span></div>`}).join('')||'<p>対象学生はいません。</p>'}`);
}
async function manageDelete(type,id){
 if(profile.role!=='teacher')return;
 const item=type==='written'?writtenTests.find(x=>String(x.id)===String(id)):assignments.find(x=>String(x.id)===String(id));
 if(!item)return;
 const count=type==='written'?writtenAnswers.filter(x=>String(x.test_id)===String(id)).length:submissions.filter(x=>String(x.assignment_id)===String(id)).length;
 if(!confirm(`「${item.title}」を削除しますか？\n提出済み：${count}件\nこの課題の学生の回答と成績も完全に削除されます。`))return;
 if(count && !confirm(`最終確認：${count}件の提出記録を含めて完全削除します。復元できません。よろしいですか？`))return;
 const r=await sb.rpc('teacher_delete_task',{p_type:type,p_id:String(id)});
 if(r.error)return alert('削除できませんでした。Supabaseで削除用SQLを設定してください。\n'+r.error.message);
 if(writtenPublishedEditing?.id===id)writtenPublishedEditing=null;
 await refresh();alert('課題と関連する提出記録を削除しました。');
}
async function writtenDeletePublished(id){return manageDelete('written',id)}

boot().catch(warn);
</script></body></html>
