<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>日本語学習システム</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;color:#263347;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}header{background:#fff;border-bottom:1px solid #e5e9f1;padding:18px max(18px,calc((100vw - 960px)/2));display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:19px;margin:0}h2{font-size:20px;margin:0 0 16px}h3{font-size:16px;margin:0 0 10px}small,.muted{color:#718096}.wrap{max-width:960px;margin:auto;padding:20px 16px 90px}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:18px}.tabs button{white-space:nowrap}button,.btn{border:0;border-radius:11px;padding:11px 15px;font-weight:650;background:#e9eef8;color:#32445f;cursor:pointer}button.primary{background:#496fe0;color:white}button.danger{background:#fff0f0;color:#ae3943}button.active{background:#496fe0;color:white}button:disabled{opacity:.5;cursor:not-allowed}.card{background:white;border:1px solid #e5eaf2;border-radius:17px;padding:18px;margin-bottom:14px;box-shadow:0 2px 9px #182a4c08}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.metric{background:#f2f5fc;border-radius:12px;padding:15px}.metric strong{font-size:26px;display:block}label{display:block;font-size:13px;font-weight:650;margin:12px 0 6px}input,select,textarea{width:100%;padding:12px;border:1px solid #dce3ed;border-radius:10px;background:white;font:inherit;font-size:15px}textarea{min-height:85px;resize:vertical}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.stack{display:flex;gap:8px;flex-wrap:wrap}.pill{display:inline-block;border-radius:100px;padding:5px 9px;background:#edf2ff;color:#4567b8;font-size:12px}.warn{background:#fff2dd;color:#9b651b}.ok{background:#e4f6ec;color:#238157}.question{padding:14px;border:1px solid #e2e8f2;border-radius:12px;margin:12px 0}.option{display:block;padding:10px;border:1px solid #e3e8f1;border-radius:9px;margin:7px 0;font-weight:400}.option input{width:auto;margin-right:8px}.hidden{display:none!important}.notice{background:#fff9e9;padding:12px;border-radius:11px;color:#855f23;font-size:13px;margin:10px 0}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e2e7ef;padding:10px;display:none}.bottom button{flex:1;font-size:12px;padding:10px 5px}@media(max-width:600px){header{padding:15px}h1{font-size:17px}.grid{grid-template-columns:repeat(2,1fr)}.wrap{padding:14px 12px 90px}.card{padding:15px}.bottom{display:flex}.desktopnav{display:none}.tabs{gap:6px}.tabs button{font-size:12px;padding:10px}.metric strong{font-size:22px}}
.auth{max-width:430px;margin:45px auto}.auth input{margin-bottom:12px}.logout{background:#fff0f0;color:#ae3943}.status{padding:12px;border-radius:10px;background:#eef4ff;margin:12px 0}.err{color:#b83243}.question label{font-weight:400}.wide{width:100%}.mutedtext{color:#718096;font-size:13px}header .stack{align-items:center}button{touch-action:manipulation} .card p{overflow-wrap:anywhere}

.editor-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.editor-grid label{margin:0}.editor-grid input{margin-top:5px}.editor-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.q-edit{background:#f7f9ff;border:1px solid #dce5fa;border-radius:13px;padding:15px;margin:12px 0}.q-edit .choice{display:flex;align-items:center;gap:7px;margin:7px 0}.q-edit .choice input[type=radio]{width:19px;flex:none}.q-edit .choice input[type=text]{flex:1;min-width:0}.q-list{display:flex;flex-direction:column;gap:9px}.q-list .question{margin:0}.q-list .question p{margin:6px 0}.compact{font-size:12px;padding:7px 10px}.sticky-publish{position:sticky;bottom:10px;background:white;padding:12px;border:1px solid #dce5fa;border-radius:12px;box-shadow:0 3px 14px #26334715;z-index:2}.batch-help{font-size:13px;color:#64748b;white-space:pre-line}@media(max-width:600px){.editor-grid{grid-template-columns:1fr}}

.written-item{padding:14px;border:1px solid #dfe6f1;border-radius:12px;margin:12px 0}.written-item textarea{min-height:65px}.written-tag{font-size:12px;background:#eef2ff;border-radius:8px;padding:4px 8px}.written-item input[type=number]{max-width:90px}.written-item .row{margin-top:9px} 
</style></head><body><div id="app"><div class="auth card">読み込み中...</div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=s=>new Date(s).toLocaleString('ja-JP',{timeZone:'Asia/Tokyo',dateStyle:'medium',timeStyle:'short'});
const closed=a=>Date.now()>new Date(a.deadline).getTime();
const cfgKey='nihongo_supabase_public_config';
let cfg={url:'https://irnhlggwhwjitfohkxxi.supabase.co',key:'sb_publishable_JUtrHWkmTGrXre3HbVUVzA_D9DvEdAh'}, sb=null, user=null, profile=null,tab='home',materials=[],assignments=[],students=[],classes=[],members=[],submissions=[],writtenTests=[],writtenAnswers=[],questionsDraft=[],answerDraft={},opened=null,showAnswer=false,editingQuestion=-1;
const warn=e=>{console.error(e);alert(e?.message||String(e))};
function initClient(){if(!cfg?.url||!cfg?.key)return false;try{sb=window.supabase.createClient(cfg.url,cfg.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});return true}catch(e){warn(e);return false}}
async function boot(){if(!initClient()){showConfig();return}const {data:{session}}=await sb.auth.getSession();if(session)await loadUser();else showLogin();sb.auth.onAuthStateChange((_event,session)=>{if(!session){user=null;profile=null;showLogin()}})}
function showLogin(msg=''){$('app').innerHTML=`<div class="auth card"><h2>🌸 日本語学習システム</h2><p class="muted">中上級クラス · ログイン</p>${msg?`<p class="err">${esc(msg)}</p>`:''}<form id="login"><label>メールアドレス</label><input type="email" id="email" required autocomplete="username"><label>パスワード</label><input type="password" id="password" required autocomplete="current-password"><button class="primary wide" type="submit">ログイン</button></form><p class="mutedtext">アカウントは教師が発行します。</p></div>`;$('login').onsubmit=async e=>{e.preventDefault();let btn=e.target.querySelector('button');btn.disabled=true;let {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});btn.disabled=false;if(error)showLogin('ログインできませんでした。メールアドレスとパスワードを確認してください。');else await loadUser()}}
async function loadUser(){let {data:{user:u},error}=await sb.auth.getUser();if(error||!u){showLogin();return}user=u;let r=await sb.from('profiles').select('id,full_name,role').eq('id',u.id).single();if(r.error||!r.data){$('app').innerHTML='<div class="auth card"><h2>プロフィール未登録</h2><p>教師にアカウント登録を依頼してください。</p><button onclick="logout()">ログアウト</button></div>';return}profile=r.data;await refresh()}
async function logout(){await sb.auth.signOut();showLogin()}
async function refresh(){let rs=await Promise.all([sb.from('materials').select('*').order('created_at',{ascending:false}),sb.from('assignments').select('*').order('created_at',{ascending:false}),sb.from('classes').select('*'),sb.from('submissions').select('*')]);for(let r of rs)if(r.error){warn(r.error);return} [materials,assignments,classes,submissions]=rs.map(r=>r.data);if(profile.role==='teacher'){let [p,m]=await Promise.all([sb.from('profiles').select('id,full_name,role').order('full_name'),sb.from('class_members').select('*')]);if(p.error||m.error)return warn(p.error||m.error);students=p.data.filter(x=>x.role==='student');members=m.data}else{let m=await sb.from('class_members').select('class_id').eq('student_id',user.id);members=m.data||[];assignments=assignments.filter(a=>members.some(x=>x.class_id===a.class_id));let results=await sb.rpc('get_my_results');if(!results.error)submissions=results.data.map(x=>({...x,student_id:user.id,score:x.score,answers:x.answers}))}await loadWritten();render()}
const navs=()=>profile.role==='teacher'?[['home','ホーム'],['students','学生管理'],['materials','教材・問題'],['assignments','課題配信'],['written','記述式テスト'],['grades','成績管理']]:[['home','ホーム'],['study','言葉・文法'],['assignments','私の課題'],['written','記述式テスト'],['grades','成績']];
function render(){let ns=navs();if(!ns.some(x=>x[0]===tab))tab='home';$('app').innerHTML=`<header><div><h1>🌸 日本語学習システム</h1><small>${esc(profile.full_name)} · ${profile.role==='teacher'?'教師':'学生'}</small></div><button class="logout" onclick="logout()">ログアウト</button></header><main class="wrap"><nav class="tabs" id="nav">${ns.map(([k,t])=>`<button class="${tab===k?'active':''}" onclick="go('${k}')">${t}</button>`).join('')}</nav><section id="screen"></section></main><div class="bottom" id="bottom">${ns.slice(0,4).map(([k,t])=>`<button class="${tab===k?'active':''}" onclick="go('${k}')">${t}</button>`).join('')}</div>`;$('screen').innerHTML=profile.role==='teacher'?teacher():student();restoreTeacherDraft()}
function go(k){tab=k;opened=null;render()}
function teacher(){if(tab==='written')return writtenTeacher();if(tab==='home')return `<h2>教師ダッシュボード</h2><div class="grid"><div class="metric"><strong>${students.length}</strong>登録学生</div><div class="metric"><strong>${assignments.length}</strong>配信課題</div><div class="metric"><strong>${submissions.length}</strong>提出件数</div></div><div class="card"><h3>クラス管理</h3><p>学生名の変更、教材登録、課題の配信、提出状況の確認ができます。</p><button class="primary" onclick="go('assignments')">課題を作成</button></div>`;
if(tab==='students')return `<h2>学生管理</h2><div class="card"><p class="notice">ログインアカウントの新規作成は Supabase Authentication で行い、profiles と class_members に登録してください。氏名の編集はここからできます。</p>${students.map(s=>`<div class="row" style="padding:12px 0;border-top:1px solid #eee"><strong>${esc(s.full_name)}</strong><button onclick="rename('${s.id}')">氏名編集</button></div>`).join('')||'学生が登録されていません。'}</div>`;
if(tab==='materials')return `<h2>教材・問題</h2><div class="card"><h3>教材を追加</h3><label>種類</label><select id="mk"><option value="vocab">言葉</option><option value="grammar">文法</option></select><label>項目</label><input id="mt"><label>読み方・接続</label><input id="mr"><label>意味・説明</label><textarea id="mm"></textarea><label>例文</label><textarea id="me"></textarea><button class="primary" onclick="addMaterial()">保存</button></div>${materials.map(m=>`<div class="card"><span class="pill">${m.kind==='vocab'?'言葉':'文法'}</span><h3>${esc(m.term)}</h3><small>${esc(m.reading)}</small><p>${esc(m.meaning)}</p><p>${esc(m.example)}</p><button class="danger" onclick="delMaterial('${m.id}')">削除</button></div>`).join('')}`;
if(tab==='assignments')return `<h2>課題配信</h2><div class="card"><h3>新しい課題</h3><div class="editor-grid"><div><label>配信クラス</label><select id="ac" onchange="saveTeacherDraft()">${classes.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div><div><label>課題名</label><input id="an" placeholder="例：N2 第1回" oninput="saveTeacherDraft()"></div></div><label>締切（日本時間）</label><input type="datetime-local" id="ad" onchange="saveTeacherDraft()"><div class="notice">提出は1回。正解と点数は締切後に公開されます。</div><div class="editor-actions"><button onclick="autoQuestions()">教材から問題を作成</button><button onclick="toggleBatch()">まとめて貼り付け</button><button class="danger" onclick="clearTeacherDraft()">草稿をクリア</button></div><div id="batchPanel" class="q-edit hidden"><h3>問題を一括追加</h3><p class="batch-help">1問につき6行（問題文、選択肢4行、正解番号）。問題同士は空行で区切ってください。</p><textarea id="batchText" style="min-height:180px" placeholder="「勉強」の意味は？&#10;学ぶこと&#10;寝ること&#10;遊ぶこと&#10;走ること&#10;1&#10;&#10;「早い」の反対は？&#10;遅い&#10;広い&#10;高い&#10;長い&#10;1"></textarea><button class="primary" onclick="importBatch()">一括追加</button></div><div class="q-edit"><h3 id="editorTitle">＋ 問題を追加</h3><label>問題文</label><textarea id="qp" placeholder="問題を入力してください" style="min-height:64px"></textarea><label>選択肢（左の丸を押して正解を指定）</label>${[0,1,2,3].map(i=>`<div class="choice"><input type="radio" name="correct" value="${i}" ${i===0?'checked':''} aria-label="選択肢${i+1}が正解"><input type="text" id="o${i}" placeholder="選択肢 ${i+1}"></div>`).join('')}<details><summary>解説を追加（任意）</summary><textarea id="qe" placeholder="解説"></textarea></details><div class="editor-actions"><button class="primary" onclick="addQuestion()" id="addQBtn">＋ 追加して次の問題へ</button><button onclick="resetQuestionEditor()">入力をクリア</button></div></div><div class="row"><h3>作成中：<span id="qCount">${questionsDraft.length}</span>問</h3><small>編集・複製・削除できます</small></div><div class="q-list" id="draftList">${draftQuestionList()}</div><div class="sticky-publish"><button class="primary wide" onclick="publish()">${questionsDraft.length}問を課題として配信</button></div></div><h3>配信済み</h3>${assignments.map(a=>`<div class="card"><strong>${esc(a.title)}</strong><p>締切：${fmt(a.deadline)} · ${closed(a)?'締切終了':'受付中'}</p></div>`).join('')}`;
if(tab==='grades')return `<h2>成績管理</h2>${assignments.map(a=>`<div class="card"><h3>${esc(a.title)}</h3><small>締切：${fmt(a.deadline)}</small>${students.filter(s=>members.some(m=>m.student_id===s.id&&m.class_id===a.class_id)).map(s=>{let r=submissions.find(x=>x.student_id===s.id&&x.assignment_id===a.id);return `<div class="row" style="border-top:1px solid #eee;padding:10px 0"><strong>${esc(s.full_name)}</strong><span>${r?`${r.score}点 · 提出済み`:'未提出'}</span></div>`}).join('')}</div>`).join('')||'<div class="card">課題がありません。</div>'}`}
async function rename(id){let s=students.find(x=>x.id===id),name=prompt('新しい氏名',s.full_name);if(!name?.trim())return;let r=await sb.rpc('update_student_name',{p_student_id:id,p_new_name:name.trim()});if(r.error)return warn(r.error);await refresh()}
async function addMaterial(){let term=$('mt').value.trim(),meaning=$('mm').value.trim();if(!term||!meaning)return alert('項目と意味は必須です');let r=await sb.from('materials').insert({kind:$('mk').value,term,reading:$('mr').value.trim(),meaning,example:$('me').value.trim()});if(r.error)return warn(r.error);await refresh()}
async function delMaterial(id){if(!confirm('削除しますか？'))return;let r=await sb.from('materials').delete().eq('id',id);if(r.error)return warn(r.error);await refresh()}
const teacherDraftKey=()=>`nihongo_teacher_draft_${user?.id||'unknown'}`;
function saveTeacherDraft(){if(profile?.role!=='teacher')return;const previous=JSON.parse(localStorage.getItem(teacherDraftKey())||'{}');localStorage.setItem(teacherDraftKey(),JSON.stringify({title:$('an')?.value??previous.title??'',deadline:$('ad')?.value??previous.deadline??'',classId:$('ac')?.value??previous.classId??'',questions:questionsDraft}))}
function restoreTeacherDraft(){if(profile?.role!=='teacher'||tab!=='assignments')return;try{let d=JSON.parse(localStorage.getItem(teacherDraftKey())||'{}');if(d.title&&$('an'))$('an').value=d.title;if(d.deadline&&$('ad'))$('ad').value=d.deadline;if(d.classId&&$('ac')&&[...$('ac').options].some(o=>o.value===String(d.classId)))$('ac').value=d.classId;if(!questionsDraft.length&&Array.isArray(d.questions))questionsDraft=d.questions;updateQuestionList()}catch(e){console.warn('草稿復元失敗',e)}}
function draftQuestionList(){return questionsDraft.map((q,i)=>`<div class="question"><div class="row"><strong>${i+1}. ${esc(q.prompt)}</strong><div class="stack"><button class="compact" onclick="editQuestion(${i})">編集</button><button class="compact" onclick="duplicateQuestion(${i})">複製</button><button class="compact danger" onclick="removeQuestion(${i})">削除</button></div></div><p class="mutedtext">正解：${esc(q.options[q.answer])}</p></div>`).join('')||'<p class="mutedtext">まだ問題がありません。</p>'}
function updateQuestionList(){if($('draftList'))$('draftList').innerHTML=draftQuestionList();if($('qCount'))$('qCount').textContent=questionsDraft.length;let b=document.querySelector('.sticky-publish button');if(b)b.textContent=`${questionsDraft.length}問を課題として配信`}
function resetQuestionEditor(){editingQuestion=-1;if(!$('qp'))return;$('qp').value='';[0,1,2,3].forEach(i=>$('o'+i).value='');if($('qe'))$('qe').value='';document.querySelector('input[name="correct"][value="0"]').checked=true;$('editorTitle').textContent='＋ 問題を追加';$('addQBtn').textContent='＋ 追加して次の問題へ'}
function editQuestion(i){let q=questionsDraft[i];if(!q)return;editingQuestion=i;$('qp').value=q.prompt;q.options.forEach((o,j)=>$('o'+j).value=o);$('qe').value=q.explanation||'';document.querySelector(`input[name="correct"][value="${q.answer}"]`).checked=true;$('editorTitle').textContent=`問題 ${i+1} を編集`;$('addQBtn').textContent='変更を保存';$('qp').scrollIntoView({behavior:'smooth',block:'center'});$('qp').focus()}
function duplicateQuestion(i){questionsDraft.splice(i+1,0,JSON.parse(JSON.stringify(questionsDraft[i])));saveTeacherDraft();updateQuestionList()}
function removeQuestion(i){questionsDraft.splice(i,1);resetQuestionEditor();saveTeacherDraft();updateQuestionList()}
function clearTeacherDraft(){if(!confirm('作成中の課題と問題をすべて消去しますか？'))return;questionsDraft=[];localStorage.removeItem(teacherDraftKey());editingQuestion=-1;render()}
function toggleBatch(){$('batchPanel').classList.toggle('hidden')}
function importBatch(){let raw=$('batchText').value.trim();if(!raw)return;let blocks=raw.split(/\n\s*\n/),out=[];for(let i=0;i<blocks.length;i++){let lines=blocks[i].split('\n').map(x=>x.trim()).filter(Boolean);if(lines.length<6)return alert(`${i+1}問目：問題文、4つの選択肢、正解番号の6行が必要です`);let answer=Number(lines[5])-1;if(!Number.isInteger(answer)||answer<0||answer>3)return alert(`${i+1}問目：正解番号は1～4で入力してください`);out.push({prompt:lines[0],options:lines.slice(1,5),answer,explanation:lines.slice(6).join('\n')})}questionsDraft.push(...out);$('batchText').value='';$('batchPanel').classList.add('hidden');saveTeacherDraft();updateQuestionList();alert(`${out.length}問を追加しました`)}
function autoQuestions(){if(materials.length<4)return alert('教材を4件以上登録してください');questionsDraft.push(...materials.map(m=>{let opts=[m.meaning,...materials.filter(x=>x.id!==m.id).map(x=>x.meaning).sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5);return {prompt:`「${m.term}」の意味として正しいものを選んでください。`,options:opts,answer:opts.indexOf(m.meaning),explanation:m.example}}));saveTeacherDraft();updateQuestionList()}
function addQuestion(){let prompt=$('qp').value.trim(),options=[0,1,2,3].map(i=>$('o'+i).value.trim());if(!prompt||options.some(x=>!x))return alert('問題文と4つの選択肢を入力してください');let q={prompt,options,answer:Number(document.querySelector('input[name="correct"]:checked').value),explanation:$('qe').value.trim()};if(editingQuestion>=0)questionsDraft[editingQuestion]=q;else questionsDraft.push(q);resetQuestionEditor();saveTeacherDraft();updateQuestionList();$('qp').focus()}
async function publish(){let title=$('an').value.trim(),raw=$('ad').value,cid=Number($('ac').value);if(!title||!raw||!questionsDraft.length)return alert('課題名、締切、問題を入力してください');let deadline=new Date(raw);if(deadline<=new Date())return alert('未来の締切を指定してください');if(!confirm(`${questionsDraft.length}問を配信しますか？`))return;let r=await sb.rpc('publish_assignment',{p_class_id:cid,p_title:title,p_deadline:deadline.toISOString(),p_questions:questionsDraft});if(r.error)return warn(r.error);questionsDraft=[];localStorage.removeItem(teacherDraftKey());editingQuestion=-1;await refresh()}
function mySub(id){return submissions.find(s=>s.assignment_id===id&&s.student_id===user.id)}
function student(){if(tab==='written')return writtenStudent();if(tab==='home'){let pending=assignments.filter(a=>!closed(a)&&!mySub(a.id));return `<h2>こんにちは、${esc(profile.full_name)}さん</h2><div class="grid"><div class="metric"><strong>${pending.length}</strong>未提出</div><div class="metric"><strong>${submissions.length}</strong>提出済み</div></div><div class="card"><h3>提出する課題</h3>${pending.map(a=>`<div class="question"><strong>${esc(a.title)}</strong><p>締切：${fmt(a.deadline)}</p><button class="primary" onclick="openAssignment('${a.id}')">回答する</button></div>`).join('')||'現在、未提出の課題はありません。'}</div>`}
if(tab==='study')return `<h2>言葉・文法</h2>${materials.map(m=>`<div class="card"><span class="pill">${m.kind==='vocab'?'言葉':'文法'}</span><h3>${esc(m.term)}</h3><small>${esc(m.reading)}</small><p>${esc(m.meaning)}</p><p class="muted">${esc(m.example)}</p></div>`).join('')}`;
if(tab==='assignments')return `<h2>私の課題</h2>${assignments.map(a=>{let r=mySub(a.id);return `<div class="card"><strong>${esc(a.title)}</strong><p>締切：${fmt(a.deadline)}</p><span class="pill">${r?'提出済み':closed(a)?'締切終了':'未提出'}</span><p>${r?(closed(a)?`得点：${r.score}点`:'締切後に得点と正解を公開します。'):''}</p>${r&&closed(a)?`<button onclick="openAssignment('${a.id}',true)">正解・解説</button>`:!r&&!closed(a)?`<button class="primary" onclick="openAssignment('${a.id}')">回答する</button>`:''}</div>`}).join('')||'<div class="card">課題がありません。</div>'}`;
if(tab==='grades')return `<h2>私の成績</h2>${assignments.filter(a=>mySub(a.id)).map(a=>`<div class="card"><strong>${esc(a.title)}</strong><p>${closed(a)?`${mySub(a.id).score}点`:'締切後に成績公開'}</p></div>`).join('')||'<div class="card">提出履歴はありません。</div>'}`}
async function openAssignment(id,review=false){let a=assignments.find(x=>x.id===id);if(!a)return;if(!review&&(closed(a)||mySub(id)))return alert('回答できません');let r=await sb.rpc('get_assignment_questions',{p_assignment:id});if(r.error)return warn(r.error);let qs=r.data;if(review&&(!closed(a)||!mySub(id)))return;opened={a,qs,review};answerDraft=review?mySub(id).answers:(JSON.parse(localStorage.getItem('draft_'+user.id+'_'+id)||'{}'));drawAssignment()}
function drawAssignment(){let {a,qs,review}=opened;$('screen').innerHTML=`<div class="row"><h2>${esc(a.title)}</h2><button onclick="render()">戻る</button></div><div class="notice">${review?'締切後の正解・解説です。':'回答はこの端末に一時保存されます。提出は1回です。'}</div>${qs.map((q,i)=>`<div class="card"><h3>問題 ${i+1}</h3><p>${esc(q.prompt)}</p>${q.options.map((o,j)=>`<label class="option"><input type="radio" name="q${i}" ${answerDraft[q.id]===j?'checked':''} ${review?'disabled':''} onchange="saveAnswer('${q.id}',${j})">${esc(o)}</label>`).join('')}${review?`<p><strong>正解：${esc(q.options[q.answer])}</strong></p><small>${esc(q.explanation)}</small>`:''}</div>`).join('')}${review?'':`<button class="primary wide" onclick="submitNow()">提出する</button>`}`}
function saveAnswer(id,v){answerDraft[id]=v;localStorage.setItem('draft_'+user.id+'_'+opened.a.id,JSON.stringify(answerDraft))}
async function submitNow(){let {a,qs}=opened;if(closed(a))return alert('締切終了');let missing=qs.filter(q=>answerDraft[q.id]===undefined).length;if(missing&&!confirm(`未回答が${missing}問あります。提出しますか？`))return;if(!confirm('提出後は変更できません。提出しますか？'))return;let r=await sb.rpc('submit_assignment',{p_assignment:a.id,p_answers:answerDraft});if(r.error)return warn(r.error);localStorage.removeItem('draft_'+user.id+'_'+a.id);opened=null;tab='assignments';await refresh();alert('提出しました！')}

// 記述式テスト（旧選択式テストとは独立）
async function loadWritten(){let a=await sb.rpc('get_written_tests');if(a.error){writtenTests=[];return}writtenTests=a.data||[];if(profile.role!=='teacher')writtenTests=writtenTests.filter(t=>members.some(m=>m.class_id===t.class_id));let r=await sb.from('written_answers').select('*');writtenAnswers=r.data||[]}
let writtenDraft=[],writtenEditing=-1,writtenPublishedEditing=null;
const writtenKey=()=>`written_draft_${user?.id}`;
function recoverWritten(){try{let x=JSON.parse(localStorage.getItem(writtenKey())||'{}');writtenDraft=x.questions||[];return x}catch(e){return {}}}
function persistWritten(){let old=JSON.parse(localStorage.getItem(writtenKey())||'{}'),x={questions:writtenDraft,title:$('wtTitle')?.value??old.title??'',deadline:$('wtDeadline')?.value??old.deadline??'',classId:$('wtClass')?.value??old.classId??''};localStorage.setItem(writtenKey(),JSON.stringify(x))}
function writtenTeacher(){let d=recoverWritten();return `<h2>記述式テスト</h2><div class="card"><h3 id="writtenFormHeading">新しいテスト</h3><div id="writtenEditNotice"></div><label>クラス</label><select id="wtClass" onchange="persistWritten()">${classes.map(c=>`<option value="${c.id}" ${String(d.classId)===String(c.id)?'selected':''}>${esc(c.name)}</option>`).join('')}</select><label>テスト名</label><input id="wtTitle" value="${esc(d.title||'')}" oninput="persistWritten()" placeholder="例：N2 語彙・文法"><label>締切</label><input type="datetime-local" id="wtDeadline" value="${esc(d.deadline||'')}" onchange="persistWritten()"><p class="notice">語彙はひらがな入力・自動採点（1点）。文法は自由作文・教師採点（0～2点）。学生は締切後に結果を確認できます。</p><div class="written-item"><h3 id="wEditTitle">問題を追加</h3><label>問題の種類</label><select id="wType" onchange="writtenTypeChange()"><option value="vocab">語彙・読み方（1点）</option><option value="grammar">文法・作文（2点）</option></select><label>問題文・漢字・文法項目</label><textarea id="wPrompt" placeholder="例：改善"></textarea><div id="wReading"><label>正解のひらがな（複数の正解は | で区切る）</label><input id="wExpected" placeholder="かいぜん"></div><label>解説・模範文（任意）</label><textarea id="wExplain"></textarea><div class="stack"><button class="primary" onclick="writtenAdd()">＋ 保存して次の問題へ</button><button onclick="writtenReset()">入力をクリア</button></div></div><h3>作成中：${writtenDraft.length}問</h3><div id="wDraftList">${writtenDraftList()}</div><button class="primary wide" id="writtenPublishBtn" onclick="writtenPublish()">記述式テストを配信</button><button id="writtenCancelBtn" class="hidden wide" onclick="writtenCancelPublishedEdit()">編集をキャンセル</button></div><h3>配信済みの記述式テスト</h3>${writtenTests.map(t=>`<div class="card"><div class="row"><strong>${esc(t.title)}</strong><div class="stack"><button onclick="writtenView('${t.id}')">詳細</button><button onclick="writtenEditPublished('${t.id}')">編集</button><button onclick="writtenResults('${t.id}')">提出・採点</button><button class="danger" onclick="writtenDeletePublished('${t.id}')">削除</button></div></div><p class="mutedtext">締切：${fmt(t.deadline)} / ${closed(t)?'締切終了':'受付中'}</p></div>`).join('')||'<div class="card">まだありません。</div>'}<div id="wResults"></div>`}
function writtenDraftList(){return writtenDraft.map((q,i)=>`<div class="written-item"><div class="row"><strong>${i+1}. ${esc(q.prompt)}</strong><span class="written-tag">${q.kind==='vocab'?'語彙':'作文'}</span></div><small>${q.kind==='vocab'?'正解：'+esc(q.expected):'教師が採点'}</small><div class="stack"><button onclick="writtenEdit(${i})">編集</button><button onclick="writtenDuplicate(${i})">複製</button><button class="danger" onclick="writtenRemove(${i})">削除</button></div></div>`).join('')||'<p class="muted">問題はまだありません。</p>'}
function writtenUpdate(){$('wDraftList').innerHTML=writtenDraftList();document.querySelector('#wDraftList').previousElementSibling.textContent=`作成中：${writtenDraft.length}問`}
function writtenTypeChange(){$('wReading').classList.toggle('hidden',$('wType').value!=='vocab')}
function writtenReset(){writtenEditing=-1;$('wPrompt').value='';$('wExpected').value='';$('wExplain').value='';$('wType').value='vocab';writtenTypeChange();$('wEditTitle').textContent='問題を追加'}
function writtenAdd(){let kind=$('wType').value,prompt=$('wPrompt').value.trim(),expected=$('wExpected').value.trim(),explanation=$('wExplain').value.trim();if(!prompt||(kind==='vocab'&&!expected))return alert('問題文と正解を入力してください');let q={kind,prompt,expected:kind==='vocab'?expected:'',explanation};if(writtenEditing<0)writtenDraft.push(q);else writtenDraft[writtenEditing]=q;writtenReset();persistWritten();writtenUpdate();$('wPrompt').focus()}
function writtenEdit(i){let q=writtenDraft[i];writtenEditing=i;$('wType').value=q.kind;$('wPrompt').value=q.prompt;$('wExpected').value=q.expected;$('wExplain').value=q.explanation;writtenTypeChange();$('wEditTitle').textContent=`問題 ${i+1} を編集`;$('wPrompt').scrollIntoView({behavior:'smooth'})}
function writtenDuplicate(i){writtenDraft.splice(i+1,0,{...writtenDraft[i]});persistWritten();writtenUpdate()}
function writtenRemove(i){writtenDraft.splice(i,1);writtenReset();persistWritten();writtenUpdate()}
async function writtenPublish(){
 let title=$('wtTitle').value.trim(),deadline=$('wtDeadline').value,cls=Number($('wtClass').value);
 if(!title||!deadline||!writtenDraft.length)return alert('テスト名、締切、問題を入力してください');
 if(!Number.isFinite(new Date(deadline).getTime()))return alert('日時を確認してください');
 if(!writtenPublishedEditing&&new Date(deadline)<=new Date())return alert('締切は未来にしてください');
 if(writtenPublishedEditing){
  const id=writtenPublishedEditing.id;
  const count=writtenAnswers.filter(a=>a.test_id===id).length;
  if(count){
   const original=writtenTests.find(t=>t.id===id);
   if(cls!==Number(original.class_id)||JSON.stringify(writtenDraft)!==JSON.stringify(original.questions))return alert('提出済みのため、問題とクラスは変更できません');
  }
  if(!confirm('変更を保存しますか？'))return;
  const update={title,class_id:cls,deadline:new Date(deadline).toISOString()};
  if(!count)update.questions=writtenDraft;
  const r=await sb.from('written_tests').update(update).eq('id',id).select('id');
  if(r.error)return warn(r.error);
  if(!r.data?.length)return alert('更新できませんでした。Supabaseの権限を確認してください。');
  writtenPublishedEditing=null;writtenDraft=[];localStorage.removeItem(writtenKey());await refresh();alert('変更を保存しました');return;
 }
 if(!confirm(`${writtenDraft.length}問を配信しますか？`))return;
 let r=await sb.from('written_tests').insert({title,class_id:cls,deadline:new Date(deadline).toISOString(),questions:writtenDraft,created_by:user.id});
 if(r.error)return warn(r.error);writtenDraft=[];localStorage.removeItem(writtenKey());await refresh();alert('配信しました')
}
function writtenStudent(){return `<h2>記述式テスト</h2>${writtenTests.map(t=>{let a=writtenAnswers.find(x=>x.test_id===t.id&&x.student_id===user.id);return `<div class="card"><div class="row"><strong>${esc(t.title)}</strong><span class="pill">${a?'提出済み':closed(t)?'締切終了':'未提出'}</span></div><p class="mutedtext">締切：${fmt(t.deadline)}</p>${a?(closed(t)?`<button onclick="writtenReview('${t.id}')">結果・解説を見る</button>`:'締切後に採点結果を公開します。'):!closed(t)?`<button class="primary" onclick="writtenOpen('${t.id}')">回答する</button>`:''}</div>`}).join('')||'<div class="card">現在、テストはありません。</div>'}<div id="wStudentForm"></div>`}
function writtenOpen(id){let t=writtenTests.find(x=>x.id===id);if(!t||closed(t)||writtenAnswers.some(x=>x.test_id===id&&x.student_id===user.id))return;let saved=JSON.parse(localStorage.getItem('written_answers_'+user.id+'_'+id)||'{}');$('wStudentForm').innerHTML=`<div class="card"><h3>${esc(t.title)}</h3><p class="notice">入力内容はこの端末に一時保存されます。提出後は変更できません。</p>${t.questions.map((q,i)=>`<div class="written-item"><strong>問題 ${i+1}｜${q.kind==='vocab'?'読み方':'文法・作文'}</strong><p>${esc(q.prompt)}</p>${q.kind==='vocab'?`<input id="wa${i}" value="${esc(saved[i]||'')}" placeholder="ひらがなで入力" oninput="writtenSaveLocal('${id}')">`:`<textarea id="wa${i}" placeholder="文を作ってください" oninput="writtenSaveLocal('${id}')">${esc(saved[i]||'')}</textarea>`}</div>`).join('')}<button class="primary wide" onclick="writtenSubmit('${id}')">提出する</button></div>`;$('wStudentForm').scrollIntoView({behavior:'smooth'})}
function writtenSaveLocal(id){let t=writtenTests.find(x=>x.id===id),answers={};t.questions.forEach((q,i)=>answers[i]=$('wa'+i)?.value||'');localStorage.setItem('written_answers_'+user.id+'_'+id,JSON.stringify(answers))}
const normalizeKana=x=>String(x||'').normalize('NFKC').trim().replace(/\s/g,'').replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-96));
async function writtenSubmit(id){let t=writtenTests.find(x=>x.id===id);if(!t||closed(t))return alert('締切終了');let answers=t.questions.map((q,i)=>$('wa'+i).value.trim());if(answers.some(x=>!x)&&!confirm('未回答があります。提出しますか？'))return;if(!confirm('提出後は変更できません。提出しますか？'))return;let grades=t.questions.map((q,i)=>q.kind==='vocab'?(q.expected.split('|').some(x=>normalizeKana(x)===normalizeKana(answers[i]))?1:0):null);let r=await sb.rpc('submit_written_test',{p_test_id:id,p_answers:answers});if(r.error)return warn(r.error);localStorage.removeItem('written_answers_'+user.id+'_'+id);await refresh();alert('提出しました')}
function writtenReview(id){let t=writtenTests.find(x=>x.id===id),a=writtenAnswers.find(x=>x.test_id===id&&x.student_id===user.id);if(!t||!a||!closed(t))return;let total=a.grades.reduce((s,g)=>s+(g||0),0),max=t.questions.reduce((s,q)=>s+(q.kind==='vocab'?1:2),0);$('wStudentForm').innerHTML=`<div class="card"><h3>${esc(t.title)}｜${a.grades.includes(null)?'採点中':total+' / '+max+' 点'}</h3>${t.questions.map((q,i)=>`<div class="written-item"><strong>${i+1}. ${esc(q.prompt)}</strong><p>回答：${esc(a.answers[i]||'（未回答）')}</p><p>得点：${a.grades[i]===null?'教師確認待ち':a.grades[i]+' / '+(q.kind==='vocab'?1:2)}</p><small>参考：${esc(q.kind==='vocab'?q.expected:q.explanation||'解説なし')}</small></div>`).join('')}</div>`;$('wStudentForm').scrollIntoView({behavior:'smooth'})}
async function writtenResults(id){let t=writtenTests.find(x=>x.id===id);if(!t)return;let list=writtenAnswers.filter(a=>a.test_id===id);$('wResults').innerHTML=`<div class="card"><div class="row"><h3>${esc(t.title)}｜提出状況</h3><button onclick="$('wResults').innerHTML=''">閉じる</button></div>${students.filter(st=>members.some(m=>m.student_id===st.id&&m.class_id===t.class_id)).map(st=>{let a=list.find(x=>x.student_id===st.id);return `<div class="written-item"><div class="row"><strong>${esc(st.full_name)}</strong>${a?`<button onclick="writtenGrade('${id}','${st.id}')">回答・採点</button>`:'未提出'}</div>${a?`<small>${a.grades.includes(null)?'採点待ち':'採点済み'}｜${a.grades.reduce((s,g)=>s+(g||0),0)}点</small>`:''}</div>`}).join('')}</div>`;$('wResults').scrollIntoView({behavior:'smooth'})}
function writtenGrade(id,studentId){let t=writtenTests.find(x=>x.id===id),a=writtenAnswers.find(x=>x.test_id===id&&x.student_id===studentId),st=students.find(x=>x.id===studentId);if(!t||!a)return;$('wResults').innerHTML=`<div class="card"><div class="row"><h3>${esc(st?.full_name||'学生')}｜${esc(t.title)}</h3><button onclick="writtenResults('${id}')">一覧に戻る</button></div>${t.questions.map((q,i)=>`<div class="written-item"><strong>問題 ${i+1}｜${q.kind==='vocab'?'語彙':'作文'}</strong><p>${esc(q.prompt)}</p><p>学生の回答：<strong>${esc(a.answers[i]||'（未回答）')}</strong></p>${q.kind==='vocab'?`<small>正解：${esc(q.expected)} / ${a.grades[i]}点</small>`:`<p class="mutedtext">模範文・解説：${esc(q.explanation||'なし')}</p><label>教師採点（0～2点）</label><select id="wg${i}"><option value="" ${a.grades[i]===null?'selected':''}>未採点</option>${[0,1,2].map(n=>`<option value="${n}" ${a.grades[i]===n?'selected':''}>${n}点</option>`).join('')}</select>`}</div>`).join('')}<button class="primary wide" onclick="writtenSaveGrades('${id}','${studentId}')">採点を保存</button></div>`;$('wResults').scrollIntoView({behavior:'smooth'})}
async function writtenSaveGrades(id,studentId){let t=writtenTests.find(x=>x.id===id),a=writtenAnswers.find(x=>x.test_id===id&&x.student_id===studentId),grades=t.questions.map((q,i)=>q.kind==='vocab'?a.grades[i]:$('wg'+i).value===''?null:Number($('wg'+i).value));let r=await sb.from('written_answers').update({grades}).eq('id',a.id);if(r.error)return warn(r.error);await loadWritten();writtenResults(id);alert('採点を保存しました')}
function writtenView(id){
 if(profile.role!=='teacher')return;
 const t=writtenTests.find(x=>x.id===id);if(!t)return;
 const count=writtenAnswers.filter(a=>a.test_id===id).length;
 $('wResults').innerHTML=`<div class="card"><div class="row"><h3>${esc(t.title)}｜詳細</h3><button onclick="writtenResults('${id}')">提出・採点</button></div><p>締切：${fmt(t.deadline)} / 提出：${count}人</p>${t.questions.map((q,i)=>`<div class="written-item"><strong>問題 ${i+1}｜${q.kind==='vocab'?'語彙':'作文'}</strong><p>${esc(q.prompt)}</p><p>配点：${q.kind==='vocab'?1:2}点</p><p>正解・参考：${esc(q.kind==='vocab'?q.expected:q.explanation||'未設定')}</p></div>`).join('')}</div>`;
 $('wResults').scrollIntoView({behavior:'smooth'});
}
function writtenEditPublished(id){
 if(profile.role!=='teacher')return;
 const t=writtenTests.find(x=>x.id===id);if(!t)return;
 if(writtenPublishedEditing||writtenDraft.length||$('wtTitle')?.value.trim()){
  if(!confirm('現在の編集中の内容を破棄して、このテストを編集しますか？'))return;
 }
 const count=writtenAnswers.filter(a=>a.test_id===id).length;
 writtenPublishedEditing={id,locked:count>0};
 writtenDraft=JSON.parse(JSON.stringify(t.questions));writtenEditing=-1;
 $('wtTitle').value=t.title;
 $('wtClass').value=String(t.class_id);
 const date=new Date(t.deadline);
 const local=new Date(date.getTime()-date.getTimezoneOffset()*60000).toISOString().slice(0,16);
 $('wtDeadline').value=local;
 $('writtenFormHeading').textContent='配信済みテストを編集';
 $('writtenEditNotice').innerHTML=count?'<p class="notice">提出済みの学生がいるため、テスト名と締切だけ変更できます。問題とクラスは編集できません。</p>':'<p class="notice">未提出のテストです。問題・正解・クラス・締切を編集できます。</p>';
 $('wtClass').disabled=count>0;
 document.querySelector('.written-item').classList.toggle('hidden',count>0);
 $('wDraftList').classList.toggle('hidden',count>0);
 $('writtenPublishBtn').textContent='変更を保存';
 $('writtenCancelBtn').classList.remove('hidden');
 writtenUpdate();
 $('writtenFormHeading').scrollIntoView({behavior:'smooth'});
}
function writtenCancelPublishedEdit(){
 writtenPublishedEditing=null;writtenDraft=[];writtenEditing=-1;
 localStorage.removeItem(writtenKey());render();
}
async function writtenDeletePublished(id){
 if(profile.role!=='teacher')return;
 const t=writtenTests.find(x=>x.id===id);if(!t)return;
 const count=writtenAnswers.filter(a=>a.test_id===id).length;
 if(count)return alert(`${count}件の提出があります。学生の回答と成績を保護するため削除できません。`);
 if(!confirm(`「${t.title}」を削除しますか？この操作は取り消せません。`))return;
 const r=await sb.from('written_tests').delete().eq('id',id).select('id');
 if(r.error)return warn(r.error);
 if(!r.data?.length)return alert('削除できませんでした。Supabaseの権限を確認してください。');
 if(writtenPublishedEditing?.id===id)writtenPublishedEditing=null;
 await refresh();alert('削除しました');
}
boot().catch(warn);
</script></body></html>
