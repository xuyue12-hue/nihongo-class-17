 if(!id||!name||!Number.isInteger(classId)){status.textContent='学生・氏名・クラスを確認してください。';return;}

async function addMaterial(){
 const btn=$('materialSaveButton'),status=$('materialSaveStatus');
 const term=$('mt')?.value.trim(),meaning=$('mm')?.value.trim();
 if(!term||!meaning){if(status)status.textContent='項目と意味・説明を入力してください。';return;}
 if(!sb){if(status)status.textContent='データベースに接続されていません。';return;}
 if(btn?.disabled)return;
 if(selectedClassId===null){if(status)status.textContent='クラスを選択してください。';return;}const data={kind:$('mk').value,term,reading:$('mr').value.trim(),meaning,example:$('me').value.trim(),class_id:selectedClassId};
 if(btn){btn.disabled=true;btn.textContent='保存中…';}
 if(status)status.textContent='保存しています…';
 try{
  const targetIds=n4Shared()&&$('materialShare')?.checked?n4Pair().map(c=>c.id):[selectedClassId];
   const r=await sb.from('materials').insert(targetIds.map(class_id=>({...data,class_id}))).select('*');
  if(r.error)throw r.error;
  if(status)status.textContent='保存しました ✓';
  // Keep the form intact until refresh confirms the newly saved item is visible.
  try{await refresh();}catch(loadError){console.error(loadError);if(status)status.textContent='保存しましたが、一覧の更新に失敗しました。ページを再読み込みしてください。';}
 }catch(e){console.error('Material save failed',e);if(status)status.textContent='保存できませんでした：'+(e?.message||String(e));}
 finally{const current=$('materialSaveButton');if(current){current.disabled=false;current.textContent='教材を保存する';}}
}
async function delMaterial(id){
 const item=materials.find(m=>String(m.id)===String(id));
 if(!confirm(`教材「${item?.term||''}」を削除しますか？\n削除後は元に戻せません。`))return;
 if(!sb)return alert('データベースに接続されていません。');
 try{
  // Returning rows is essential: with RLS, DELETE can affect zero rows without an error.
  const {data,error}=await sb.from('materials').delete().eq('id',id).select('id');
  if(error)throw error;
  if(!data?.length){alert('削除できませんでした。Supabase の DELETE 権限（RLS）を確認してください。');return;}
  await refresh();
  if(materials.some(m=>String(m.id)===String(id)))alert('削除後の一覧に教材が残っています。再読み込みして確認してください。');
  else alert('教材を削除しました。');
 }catch(e){console.error('Material deletion failed',e);alert('削除できませんでした：'+(e?.message||String(e)));}
}

function resetQuestionEditor(){editingQuestion=-1;if(!$('qp'))return;$('qp').value='';[0,1,2,3].forEach(i=>$('o'+i).value='');if($('qe'))$('qe').value='';document.querySelector('input[name="correct"][value="0"]').checked=true;$('editorTitle').textContent='＋ 問題を追加';$('addQBtn').textContent='＋ 追加して次の問題へ'}

function toggleBatch(){$('batchPanel').classList.toggle('hidden')}
function importBatch(){let raw=$('batchText').value.trim();if(!raw)return;let blocks=raw.split(/\n\s*\n/),out=[];for(let i=0;i<blocks.length;i++){let lines=blocks[i].split('\n').map(x=>x.trim()).filter(Boolean);if(lines.length<6)return alert(`${i+1}問目：問題文、4つの選択肢、正解番号の6行が必要です`);let answer=Number(lines[5])-1;if(!Number.isInteger(answer)||answer<0||answer>3)return alert(`${i+1}問目：正解番号は1～4で入力してください`);out.push({prompt:lines[0],options:lines.slice(1,5),answer,explanation:lines.slice(6).join('\n')})}questionsDraft.push(...out);$('batchText').value='';$('batchPanel').classList.add('hidden');saveTeacherDraft();updateQuestionList();alert(`${out.length}問を追加しました`)}
function autoQuestions(){if(teacherMode!=='meaning')return;const source=teacherMaterials();if(source.length<4)return alert('このクラスの教材を4件以上登録してください');questionsDraft.push(...source.map(m=>{let opts=[m.meaning,...source.filter(x=>x.id!==m.id).map(x=>x.meaning).sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5);return {prompt:m.term,options:opts,answer:opts.indexOf(m.meaning),explanation:'[MEANING_CHOICE] '+(m.example||'')}}));saveTeacherDraft();updateQuestionList()}
function addQuestion(){let prompt=$('qp').value.trim(),options=[0,1,2,3].map(i=>$('o'+i).value.trim());if(!prompt||options.some(x=>!x))return alert('単語と4つの意味を入力してください');if(new Set(options).size!==4)return alert('4つの選択肢にはそれぞれ異なる内容を入力してください');let q={prompt,options,answer:Number(document.querySelector('input[name="correct"]:checked').value),explanation:(teacherMode==='meaning'?'[MEANING_CHOICE] ':'')+$('qe').value.trim()};if(editingQuestion>=0)questionsDraft[editingQuestion]=q;else questionsDraft.push(q);resetQuestionEditor();saveTeacherDraft();updateQuestionList();$('qp').focus()}
async function publish(){
 const title=$('an').value.trim(),raw=$('ad').value,cid=Number($('ac').value);
 if(!title||!raw||!questionsDraft.length)return alert('課題名、締切、問題を入力してください');

 const ids=n4Shared()&&$('assignmentShare')?.checked?n4Pair().map(c=>c.id):[cid];
 const names=ids.map(id=>classes.find(c=>String(c.id)===String(id))?.name||id).join('・');
 if(!confirm(`${questionsDraft.length}問を「${names}」に配信しますか？\n各クラスの提出・成績は別々に管理されます。`))return;
 const btn=document.querySelector('.sticky-publish button');if(btn)btn.disabled=true;
 let completed=[];
 try{
  for(const classId of ids){
   const r=await sb.rpc('publish_assignment',{p_class_id:Number(classId),p_title:title,p_deadline:deadline.toISOString(),p_questions:questionsDraft});
   if(r.error)throw new Error(`${classes.find(c=>String(c.id)===String(classId))?.name||classId}への配信に失敗：${r.error.message}`);
   completed.push(classId);
  }
  questionsDraft=[];localStorage.removeItem(teacherDraftKey());editingQuestion=-1;await refresh();
  alert(`${names}への配信が完了しました。`);
 }catch(e){
  alert((completed.length?'一部のクラスには配信済みです。重複配信を避けるため「課題管理」で確認してください。\n':'')+e.message);
 }finally{if(btn?.isConnected)btn.disabled=false;}
}

function clearReadingPreview(){readingCandidates=[];if($('readingPreview'))$('readingPreview').innerHTML='';if($('readingAddBtn'))$('readingAddBtn').classList.add('hidden');if($('readingStatus'))$('readingStatus').textContent='';}
const kanaOnly=s=>/^[ぁ-ゖー・\s]+$/.test(s);
function readingOptions(reading,pool){let options=[reading];for(const r of pool){if(r&&r!==reading&&!options.includes(r))options.push(r);if(options.length===4)break;}return options;}
// 読み方検索は Web Worker 内で実行し、Safari の画面をブロックしない。
let readingWorker=null, readingWorkerUrl=null, readingLookupBusy=false;
function stopReadingWorker(){
 if(readingWorker){readingWorker.terminate();readingWorker=null;}
 if(readingWorkerUrl){URL.revokeObjectURL(readingWorkerUrl);readingWorkerUrl=null;}
}
function katakanaToHiragana(s){return String(s||'').replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-96));}
function lookupReadingsInWorker(words, onProgress){
 return new Promise((resolve,reject)=>{
  // A fresh worker per lookup also ensures that a timed-out dictionary never keeps running.
  stopReadingWorker();
  const source = `
   const kanaOnly=s=>/^[ぁ-ゖー・\\s]+$/.test(s);
   const hira=s=>String(s||'').replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-96));
   function getReading(tokenizer,word){
    const tokens=tokenizer.tokenize(word); if(!tokens.length)return '';
    let result='';
    for(const token of tokens){
     if(token.reading&&token.reading!=='*')result+=hira(token.reading);
     else if(/^[ぁ-ゖァ-ヶー]+$/.test(token.surface_form))result+=hira(token.surface_form);
     else return '';
    }
    return kanaOnly(result)?result:'';
   }
   self.onmessage=function(event){
    const words=event.data.words;
    try{
     importScripts('https://cdn.jsdelivr.net/npm/kuromoji@0.1.2/build/kuromoji.js');
     self.postMessage({type:'progress',message:'辞書データを読み込んでいます…'});
     kuromoji.builder({dicPath:'https://cdn.jsdelivr.net/npm/kuromoji@0.1.2/dict/'}).build((err,tokenizer)=>{
      if(err){self.postMessage({type:'error',message:String(err.message||err)});return;}
      try{
       const results=[];
       for(let i=0;i<words.length;i++){
        const word=words[i];const reading=getReading(tokenizer,word);
        results.push({word,reading,alternatives:reading?[reading]:[],checked:false});
        if(i%10===9)self.postMessage({type:'progress',message:(i+1)+' / '+words.length+' 語を解析中…'});
       }
       self.postMessage({type:'done',results});
      }catch(e){self.postMessage({type:'error',message:String(e.message||e)});}
     });
    }catch(e){self.postMessage({type:'error',message:String(e.message||e)});}
   };`;
  let settled=false, timer;
  const finish=(error,results)=>{
   if(settled)return;settled=true;clearTimeout(timer);stopReadingWorker();
   if(error)reject(error);else resolve(results);
  };
  try{
   readingWorkerUrl=URL.createObjectURL(new Blob([source],{type:'application/javascript'}));
   readingWorker=new Worker(readingWorkerUrl);
   readingWorker.onmessage=e=>{
    const d=e.data||{};
    if(d.type==='progress'){onProgress(d.message);return;}
    if(d.type==='done')finish(null,d.results);
    if(d.type==='error')finish(new Error(d.message||'辞書の解析に失敗しました'));
   };
   readingWorker.onerror=e=>finish(new Error(e.message||'辞書ワーカーを起動できませんでした'));
   // Unlike Promise.race on the main thread, terminate() actually stops the work.
   timer=setTimeout(()=>finish(new Error('辞書の処理が30秒を超えたため停止しました')),30000);
   readingWorker.postMessage({words});
  }catch(e){finish(e);}
 });
}

function makeDistractors(reading,allReadings){
 const out=[];const add=v=>{if(v&&v!==reading&&kanaOnly(v)&&!out.includes(v))out.push(v)};
 // 他の単語の読みを先に使い、足りない場合は音の近い候補を生成する。
 // 他の問題の正解をそのまま流用しない（無関係な選択肢を防ぐ）。
 const chars=[...reading];
 const replacements=[['か','が'],['が','か'],['し','じ'],['じ','し'],['た','だ'],['だ','た'],['き','ぎ'],['ぎ','き'],['せ','ぜ'],['ぜ','せ'],['つ','っ'],['っ','つ'],['ん','う'],['う','ん'],['く','ぐ'],['ぐ','く'],['は','ば'],['ば','は']];
 for(let i=0;i<chars.length;i++)for(const [a,b] of replacements)if(chars[i]===a){let c=chars.slice();c[i]=b;add(c.join(''));}
 for(let i=0;i<chars.length&&out.length<3;i++)for(const c of ['か','し','つ','ん','う','く','き','せ','た']){let x=chars.slice();x[i]=c;add(x.join(''));if(out.length>=3)break;}
 return out.slice(0,3);
}
function addReadingQuestions(){
 if(!readingCandidates.length)return;
 const values=readingCandidates.map((q,i)=>({word:q.word,reading:($('readingValue'+i)?.value||'').trim().normalize('NFKC')}));
 const bad=values.findIndex(x=>!x.reading||!kanaOnly(x.reading));
 if(bad>=0){$('readingValue'+bad)?.focus();return alert(`${bad+1}番「${values[bad].word}」の読み方をひらがなで入力・修正してください。`);}
 if(!confirm(`${values.length}問の読み方を確認して課題に追加しますか？\n間違っている読み方があれば「キャンセル」で修正できます。`))return;
  const all=values.map(x=>x.reading),questions=[];
 for(let i=0;i<values.length;i++){
  const q=values[i],other=makeDistractors(q.reading,all.filter((_,j)=>j!==i));
  if(other.length<3||new Set([q.reading,...other]).size!==4)return alert(`${i+1}番の選択肢を作成できませんでした。手動で問題を作成してください。`);
  const options=[q.reading,...other];
  // 選択肢の正解位置を分散
  const shift=i%4;for(let j=0;j<shift;j++)options.push(options.shift());
  questions.push({prompt:q.word,options,answer:options.indexOf(q.reading),explanation:`[READING_CARD] ${$('readingBook').value} ${$('readingLesson').value.trim()}｜${q.word}：${q.reading}`});
 }
 questionsDraft.push(...questions);saveTeacherDraft();updateQuestionList();clearReadingPreview();
 alert(`${questions.length}問を追加しました。下の「作成中」で選択肢を確認・編集してから配信してください。`);
 $('draftList').scrollIntoView({behavior:'smooth'});
}

function isReadingCard(q){
  if(String(q.explanation||'').startsWith('[MEANING_CHOICE]'))return false;
 // 旧版で配信された読み方問題もカード表示する（タグがない問題を含む）。

 const bare=prompt.replace(/[「」『』\s]/g,'').replace(/の読み方として正しいものを選んでください[。．.]?/g,'').replace(/の読み方は[？?]?/g,'');
 return /[一-龯々〆ヵヶ]/.test(bare)&&opts.length===4&&opts.every(x=>/^[ぁ-ゖァ-ヺー\s]+$/.test(String(x||'').trim()));
}
function readingWord(q){return String(q.prompt||'').trim().replace(/^「([^」]+)」の読み方として正しいものを選んでください[。．.]?$/,'$1').replace(/^「([^」]+)」の読み方は[？?]?$/,'$1')}

}

 ${d.questions.map((q,i)=>`<div class="q-edit"><h3>問題 ${i+1}</h3><label>問題文</label><textarea id="mcPrompt${i}" ${d.locked?'disabled':''}>${esc(q.prompt)}</textarea><label>選択肢（正解の丸を選択）</label>${(q.options||[]).map((o,j)=>`<div class="choice"><input type="radio" name="mcAnswer${i}" value="${j}" ${Number(q.answer)===j?'checked':''} ${d.locked?'disabled':''}><input type="text" id="mcOpt${i}_${j}" value="${esc(o)}" ${d.locked?'disabled':''}></div>`).join('')}<label>解説</label><textarea id="mcExplain${i}" ${d.locked?'disabled':''}>${esc(q.explanation||'')}</textarea></div>`).join('')}
 <div class="stack"><button class="primary" onclick="manageSaveChoice('${d.id}')">変更を保存</button><button onclick="go('manage')">キャンセル</button></div>`);
}
async function manageSaveChoice(id){
 const d=manageChoiceDraft;
 if(!d||d.id!==id)return;
 const title=$('manageTitle')?.value.trim(),raw=$('manageDeadline')?.value,date=new Date(raw);
 if(!title||!raw||!Number.isFinite(date.getTime()))return alert('課題名と正しい締切を入力してください');
 const changes=[];
 if(!d.locked){
  for(let i=0;i<d.questions.length;i++){
   const q=d.questions[i],prompt=$('mcPrompt'+i).value.trim(),options=(q.options||[]).map((_,j)=>$('mcOpt'+i+'_'+j).value.trim());
   const answer=Number(document.querySelector(`input[name="mcAnswer${i}"]:checked`)?.value);
   const explanation=$('mcExplain'+i).value.trim();
   if(!prompt||options.some(x=>!x)||!Number.isInteger(answer)||answer<0||answer>=options.length)return alert(`問題 ${i+1} の入力を確認してください`);
   if(!q.id)return alert('問題IDが取得できません。保存できません。');
   const updated={prompt,options,answer,explanation};
   if(JSON.stringify(updated)!==JSON.stringify({prompt:q.prompt,options:q.options,answer:q.answer,explanation:q.explanation||''}))changes.push({id:q.id,...updated});
  }
 }
 if(!confirm(`課題情報${changes.length?'と問題 '+changes.length+' 件':''}を更新しますか？`))return;
 // 問題の更新は専用の教師用RPCを使用し、学生の採点権限とは分離する。
 if(changes.length){
  const r=await sb.rpc('teacher_update_assignment_questions',{p_assignment:id,p_questions:changes});
  if(r.error)return alert('問題の更新に失敗しました。教師用SQLの設定を確認してください。\n'+r.error.message);
 }
 const r=await sb.from('assignments').update({title,deadline:date.toISOString()}).eq('id',id).select('id');
 if(r.error)return warn(r.error);
 if(!r.data?.length)return alert('課題名・締切を更新できません。Supabaseの権限を確認してください。');
 manageChoiceDraft=null;await refresh();alert('変更を保存しました');
}

async function manageStudentAnswers(assignmentId,studentId){
 if(profile?.role!=='teacher')return;
 const a=assignments.find(x=>String(x.id)===String(assignmentId));
 const st=students.find(x=>String(x.id)===String(studentId));
 const submission=submissions.find(x=>String(x.assignment_id)===String(assignmentId)&&String(x.student_id)===String(studentId));
 if(!a||!submission)return alert('提出済みの回答が見つかりません。');
 manageShow(`<h3>${esc(st?.full_name||'学生')}｜${esc(a.title)}</h3><p>問題を読み込んでいます…</p>`);
 const r=await sb.rpc('get_assignment_questions',{p_assignment:assignmentId});
 if(r.error)return manageShow(`<h3>回答を表示できません</h3><p class="notice">教師の問題閲覧権限を確認してください：${esc(r.error.message)}</p><button onclick="manageSubmissions('choice','${assignmentId}')">提出一覧に戻る</button>`);
 const qs=(r.data||[]).slice().sort((x,y)=>Number(x.question_position??x.position??0)-Number(y.question_position??y.position??0));
 let answers=submission.answers||{};
 if(typeof answers==='string'){try{answers=JSON.parse(answers)}catch(e){answers={}}}
 const detail=qs.map((q,i)=>{
  const opts=Array.isArray(q.options)?q.options:[];
  const raw=answers[q.id]??answers[String(q.id)];
  const chosen=raw===undefined||raw===null?'':Number(raw);
  const hasAnswer=raw!==undefined&&raw!==null&&raw!=='';
  const valid=hasAnswer&&Number.isInteger(chosen)&&chosen>=0&&chosen<opts.length;
  const known=Number.isInteger(q.answer)&&q.answer>=0&&q.answer<opts.length;
  const correct=known&&valid&&chosen===q.answer;
  return `<div class="written-item"><div class="row"><strong>問題 ${i+1}｜${esc(q.prompt)}</strong><span class="pill ${!hasAnswer?'warn':known&&correct?'ok':known?'warn':''}">${!hasAnswer?'未回答':!known?'判定不可':correct?'✓ 正解':'✕ 不正解'}</span></div><p>学生の回答：<strong>${esc(valid?opts[chosen]:hasAnswer?String(raw):'（未回答）')}</strong></p><p>正解：<strong>${esc(known?opts[q.answer]:'正解データなし')}</strong></p>${q.explanation?`<p class="mutedtext">${esc(String(q.explanation).replace(/^\[(READING_CARD|MEANING_CHOICE)\]\s*/,''))}</p>`:''}</div>`;
 }).join('');
 manageShow(`<div class="row"><h3>${esc(st?.full_name||'学生')}｜${esc(a.title)}</h3><button onclick="manageSubmissions('choice','${assignmentId}')">提出一覧に戻る</button></div><p><strong>得点：${esc(submission.score)}点</strong> ／ ${qs.length}問</p>${submission.submitted_at||submission.created_at?`<p class="mutedtext">提出日時：${fmt(submission.submitted_at||submission.created_at)}</p>`:''}${detail||'<p>問題がありません。</p>'}`);
}

async function manageDelete(type,id){
 if(profile.role!=='teacher')return;
 const item=type==='written'?writtenTests.find(x=>String(x.id)===String(id)):assignments.find(x=>String(x.id)===String(id));
 if(!item)return;
 const count=type==='written'?writtenAnswers.filter(x=>String(x.test_id)===String(id)).length:submissions.filter(x=>String(x.assignment_id)===String(id)).length;
 if(!confirm(`「${item.title}」を削除しますか？\n提出済み：${count}件\nこの課題の学生の回答と成績も完全に削除されます。`))return;
 if(count && !confirm(`最終確認：${count}件の提出記録を含めて完全削除します。復元できません。よろしいですか？`))return;
 const r=await sb.rpc('teacher_delete_task',{p_type:type,p_id:String(id)});
 if(r.error)return alert('削除できませんでした。Supabaseで削除用SQLを設定してください。\n'+r.error.message);
 if(writtenPublishedEditing?.id===id)writtenPublishedEditing=null;
 await refresh();alert('課題と関連する提出記録を削除しました。');
}

function scorePass(e,r){if(e.exam_type!=='JLPT模擬試験')return '';const level=e.level;const vals=[r.language_score,r.reading_score,r.listening_score];if(vals.some(v=>v===null||v===undefined))return '未入力';if(!['N1','N2','N3','N4','N5'].includes(level))return '判定対象外';const total=scoreTotal(r);const minTotal={N1:100,N2:90,N3:95,N4:90,N5:80}[level];if(level==='N4'||level==='N5'){return total>=minTotal&&(Number(vals[0])+Number(vals[1]))>=38&&Number(vals[2])>=19?'合格圏':'要復習'}return total>=minTotal&&vals.every(v=>Number(v)>=19)?'合格圏':'要復習'}

async function scoreDeleteExam(id){const e=scoreExams.find(x=>x.id===id);if(!e||!confirm(`「${e.title}」と全員の成績を削除しますか？\n元に戻せません。`))return;const r=await sb.from('score_exams').delete().eq('id',id).select('id');if(r.error)return warn(r.error);if(!r.data?.length)return alert('削除権限がありません');await refresh()}
function scoreOpen(id){const e=scoreExams.find(x=>x.id===id);if(!e)return;scoreExamSelected=id;scoreDraftRows=scoreStudents().map(st=>{let r=scoreRecords.find(x=>x.exam_id===id&&x.student_id===st.id);return {student_id:st.id,student_name:st.full_name,language_score:r?.language_score??'',reading_score:r?.reading_score??'',listening_score:r?.listening_score??'',note:r?.note??''}});scoreDrawEditor()}
function scoreDrawEditor(){const e=scoreExams.find(x=>x.id===scoreExamSelected),target=$('scoreEditor');if(!e||!target)return;target.innerHTML=`<div class="card"><div class="row"><h3>${esc(e.title)}｜成績入力</h3><button onclick="$('scoreEditor').innerHTML=''">閉じる</button></div><p class="mutedtext">満点：言語知識 ${e.max_language} ／ 読解 ${e.max_reading} ／ 聴解 ${e.max_listening} ／ 合計 ${scoreMaxTotal(e)}。空欄は未入力として保存します。</p><div class="stack"><button onclick="scoreDownloadTemplate()">CSVテンプレート</button><button onclick="scoreExportCurrent()">登録済み成績をCSV出力</button></div><label>Excel（.xlsx/.xls）またはCSVを取り込む</label><input type="file" id="scoreFile" accept=".xlsx,.xls,.csv" onchange="scoreImportFile(this.files[0])"><p class="mutedtext" id="scoreImportStatus">列名：学生ID または 学生名、言語知識、読解、聴解、備考。学生IDがあれば優先して照合します。</p><div class="score-scroll"><table class="score-table"><thead><tr><th>学生名</th><th>言語知識</th><th>読解</th><th>聴解</th><th>合計</th><th>備考</th></tr></thead><tbody>${scoreDraftRows.map((r,i)=>`<tr><td>${esc(r.student_name)}</td>${['language_score','reading_score','listening_score'].map((k,j)=>`<td><input type="number" min="0" max="${scoreMax(e)[j]}" step="1" value="${esc(r[k])}" aria-label="${esc(r.student_name)} ${k}" oninput="scoreEditCell(${i},'${k}',this.value)"></td>`).join('')}<td id="scoreSum${i}">${scoreTotal(r)}</td><td><input value="${esc(r.note)}" oninput="scoreEditCell(${i},'note',this.value)"></td></tr>`).join('')}</tbody></table></div><p class="notice">保存前に氏名と点数を確認してください。既存の同一テスト成績は上書きされます。学生への公開は別途操作します。</p><button class="primary wide" id="scoreSaveBtn" onclick="scoreSaveAll()">${scoreDraftRows.length}名分の成績を保存</button></div>`;target.scrollIntoView({behavior:'smooth',block:'start'})}
function scoreEditCell(i,k,v){scoreDraftRows[i][k]=v;if(k!=='note'&&$('scoreSum'+i))$('scoreSum'+i).textContent=scoreTotal(scoreDraftRows[i])}
function scoreCSV(rows){return '\ufeff'+rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n')}
function scoreDownload(name,content){const b=new Blob([content],{type:'text/csv;charset=utf-8'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function scoreDownloadTemplate(){const list=scoreStudents();scoreDownload('テスト成績_入力テンプレート.csv',scoreCSV([['学生ID','学生名','言語知識','読解','聴解','備考'],...list.map(st=>[st.id,st.full_name,'','','',''])]))}
function scoreExportCurrent(){const e=scoreExams.find(x=>x.id===scoreExamSelected);if(!e)return;scoreDownload('成績_'+e.exam_date+'.csv',scoreCSV([['学生ID','学生名','言語知識','読解','聴解','備考'],...scoreDraftRows.map(r=>[r.student_id,r.student_name,r.language_score,r.reading_score,r.listening_score,r.note])]))}
async function scoreImportFile(file){if(!file)return;try{if(!window.XLSX)throw Error('Excel読込ライブラリが読み込めません。インターネット接続を確認してください');const data=await file.arrayBuffer(),book=XLSX.read(data,{type:'array'}),sheet=book.Sheets[book.SheetNames[0]],rows=XLSX.utils.sheet_to_json(sheet,{defval:'',raw:false});if(!rows.length)throw Error('データがありません');const norm=x=>String(x).trim().replace(/[\s　]/g,'').toLowerCase();const get=(r,keys)=>{const key=Object.keys(r).find(k=>keys.includes(norm(k)));return key===undefined?'':String(r[key]).trim()};let updated=0,unmatched=[],duplicates=[];const names=new Map();for(const st of scoreStudents()){const n=norm(st.full_name);names.set(n,[...(names.get(n)||[]),st.id])}const seen=new Set();for(const row of rows){const id=get(row,['学生id','studentid','id']),name=get(row,['学生名','氏名','名前','name']);let target=scoreDraftRows.find(x=>x.student_id===id);if(!target&&name){const ids=names.get(norm(name))||[];if(ids.length===1)target=scoreDraftRows.find(x=>x.student_id===ids[0]);else if(ids.length>1){unmatched.push(name+'（同姓同名）');continue}}if(!target){unmatched.push(name||id||'不明');continue}if(seen.has(target.student_id)){duplicates.push(target.student_name);continue}seen.add(target.student_id);const fields=[['language_score',['言語知識','語彙文法','language']],['reading_score',['読解','reading']],['listening_score',['聴解','listening']]];for(const [k,aliases] of fields){const v=get(row,aliases);if(v!=='')target[k]=v}const note=get(row,['備考','note']);if(note)target.note=note;updated++}scoreDrawEditor();$('scoreImportStatus').textContent=`取込プレビュー：${updated}名を反映。${unmatched.length?'未照合：'+unmatched.join('、')+'。':''}${duplicates.length?'重複行：'+duplicates.join('、')+'。':''} 内容を確認して「保存」を押してください。`;if(unmatched.length||duplicates.length)alert('照合できない行または重複があります。プレビューを確認してください。')}catch(err){alert('ファイルを読み込めませんでした：'+err.message)}}
async function scoreSaveAll(){const e=scoreExams.find(x=>x.id===scoreExamSelected);if(!e)return;const max=scoreMax(e),payload=[];for(const r of scoreDraftRows){let vals=[];for(let i=0;i<3;i++){const raw=r[['language_score','reading_score','listening_score'][i]];if(String(raw).trim()===''){vals.push(null);continue}const n=Number(raw);if(!Number.isInteger(n)||n<0||n>max[i])return alert(`${r.student_name}：点数は0～${max[i]}の整数で入力してください`);vals.push(n)}payload.push({exam_id:e.id,student_id:r.student_id,language_score:vals[0],reading_score:vals[1],listening_score:vals[2],note:String(r.note||'').slice(0,500)})}if(!confirm(`${payload.length}名分の成績を保存しますか？`))return;const btn=$('scoreSaveBtn');btn.disabled=true;btn.textContent='保存中…';try{const res=await sb.from('score_results').upsert(payload,{onConflict:'exam_id,student_id'}).select('student_id');if(res.error)throw res.error;if(res.data?.length!==payload.length)throw Error('保存件数が一致しません。権限を確認してください');await refresh();scoreOpen(e.id);alert('成績を保存しました')}catch(err){alert('保存に失敗しました：'+err.message);btn.disabled=false;btn.textContent='成績を保存'}}
function studentExamGrades(){const exams=scoreExams.filter(e=>e.published).sort((a,b)=>String(b.exam_date).localeCompare(String(a.exam_date)));const rows=exams.map(e=>({e,r:scoreRecords.find(r=>r.exam_id===e.id&&r.student_id===user.id)})).filter(x=>x.r);const jlpt=rows.filter(x=>x.e.exam_type==='JLPT模擬試験'&&scoreMaxTotal(x.e)>0).slice().reverse();return `<h3>テスト成績</h3>${scoreNotice()}${rows.map(({e,r})=>`<details class="card study-details"><summary style="list-style:none;display:block"><div class="row"><strong>${esc(e.title)}</strong><span class="pill">${esc(e.exam_type)}</span></div><p class="mutedtext">${esc(e.exam_date)} ${esc(e.level||'')}</p><div class="row"><h3 style="margin:0">${scoreTotal(r)} / ${scoreMaxTotal(e)} 点 ${scorePass(e,r)?`<span class="score-badge">${scorePass(e,r)}</span>`:''}</h3><span class="mutedtext">詳細を見る ▾</span></div></summary><div class="grid" style="margin-top:14px"><div class="metric">言語知識<br><strong>${r.language_score??'—'} / ${e.max_language}</strong></div><div class="metric">読解<br><strong>${r.reading_score??'—'} / ${e.max_reading}</strong></div><div class="metric">聴解<br><strong>${r.listening_score??'—'} / ${e.max_listening}</strong></div></div>${r.note?`<p>先生からのメモ：${esc(r.note)}</p>`:''}</details>`).join('')||'<div class="card">公開済みのテスト成績はありません。</div>'}${jlpt.length>1?`<div class="card"><h3>JLPT模擬試験の得点推移（得点率）</h3><div class="score-chart">${jlpt.map(({e,r})=>`<div class="score-bar"><div style="height:${Math.max(2,Math.round(scoreTotal(r)/scoreMaxTotal(e)*110))}px"></div><small>${esc(e.exam_date)}</small><small>${Math.round(scoreTotal(r)/scoreMaxTotal(e)*100)}%</small></div>`).join('')}</div></div>`:''}`}


// 毎日10単語学習（既存課題から独立）
let dvSet=null,dvQuiz=null,dvIndex=0,dvAnswers=[],dvMode='cards',dvCalendar=[],dvMonth=new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Tokyo'}).slice(0,7),dvLoading=false;
function dvToday(){return new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Tokyo'});}
function dailyVocabPage(){
 const words=dvSet?.words||[];
 let body=`<h2>毎日10単語学習</h2><div class="card"><label>自分のJLPTレベル</label><select id="dvLevel" onchange="dvSaveLevel(this.value)">${['N5','N4','N3','N2','N1'].map(x=>`<option value="${x}" ${x===(dvSet?.level||'N4')?'selected':''}>${x}</option>`).join('')}</select><p class="mutedtext">レベル変更は翌日から反映されます。毎日0時（日本時間）に新しい10語になります。</p><button class="primary" onclick="dvLoad()" ${dvLoading?'disabled':''}>${dvLoading?'読み込み中…':'今日の10単語を表示'}</button><p id="dvStatus" class="mutedtext"></p></div>`;
 if(dvSet){body+=`<div class="card"><div class="row"><strong>${esc(dvSet.date)} · ${esc(dvSet.level)}</strong><span class="pill ${dvSet.completed?'ok':''}">${dvSet.completed?'✓ 学習完了':'未完了'}</span></div></div>`;
 if(dvMode==='cards'&&words.length){let w=words[dvIndex];body+=`<div class="reading-card"><p class="reading-progress">単語 ${dvIndex+1} / ${words.length}</p><div class="reading-word" style="padding:25px 10px 10px">${esc(w.term)}</div><p style="text-align:center;font-size:21px">${esc(w.reading)}</p><div class="question"><strong>意味</strong><p>${esc(w.meaning_ja)}</p><strong>例文</strong><p>${esc(w.example_ja||'—')}</p></div></div><div class="reading-navigation"><button onclick="dvIndex=Math.max(0,dvIndex-1);render()" ${dvIndex===0?'disabled':''}>前へ</button>${dvIndex===words.length-1?`<button class="primary" onclick="dvStartQuiz()">10問テストへ</button>`:`<button class="primary" onclick="dvIndex++;render()">次へ</button>`}</div>`;}
 if(dvMode==='quiz'&&dvQuiz?.length){let q=dvQuiz[dvIndex];body+=`<div class="reading-card"><p class="reading-progress">問題 ${dvIndex+1} / 10 · ${q.kind==='reading'?'読み方':'意味'}</p><div class="reading-word" style="padding:28px 10px">${esc(q.prompt)}</div><div class="reading-options">${q.options.map((o,i)=>`<button class="reading-option ${dvAnswers[dvIndex]===i?'selected':''}" onclick="dvChoose(${i})" ${dvAnswers[dvIndex]!==undefined?'disabled':''}>${esc(o)}</button>`).join('')}</div><p class="mutedtext">一度選ぶと変更できません。</p></div><div class="reading-navigation"><button onclick="dvMode='cards';dvIndex=0;dvQuiz=null;dvAnswers=[];render()">学習に戻る</button><button class="primary" onclick="dvNext()" ${dvAnswers[dvIndex]===undefined?'disabled':''}>${dvIndex===9?'採点する':'次の問題'}</button></div>`;}
 if(dvMode==='result'){body+=`<div class="card"><h3>採点結果</h3><p>${esc(dvResult||'')}</p><button class="primary" onclick="dvStartQuiz()">もう一度テストする</button><button onclick="dvMode='cards';dvIndex=0;render()">単語を復習</button></div>`;}
 }
 const year=Number(dvMonth.slice(0,4)),month=Number(dvMonth.slice(5,7));const days=new Date(year,month,0).getDate(),first=new Date(year,month-1,1).getDay();const completed=new Set(dvCalendar.map(x=>x.date));let cells='';for(let i=0;i<first;i++)cells+='<span></span>';for(let d=1;d<=days;d++){let date=`${dvMonth}-${String(d).padStart(2,'0')}`;cells+=`<span style="padding:8px 2px;text-align:center;border-radius:8px;background:${completed.has(date)?'#d6f5e5':'#f3f5f9'};color:${completed.has(date)?'#176c47':'#637084'}">${d}${completed.has(date)?' ✓':''}</span>`;}
 body+=`<div class="card"><div class="row"><h3>学習カレンダー</h3><input type="month" style="max-width:170px" value="${dvMonth}" onchange="dvMonth=this.value;dvLoadCalendar()"></div><div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;font-size:12px">${['日','月','火','水','木','金','土'].map(x=>`<strong style="text-align:center">${x}</strong>`).join('')}${cells}</div><p class="mutedtext">緑色は全問正解で完了した日です。</p></div>`;
 return body;
}
let dvResult='';
async function dvSaveLevel(level){if(!confirm(`JLPT ${level} に変更しますか？\n今日の単語は変わりません。`)){render();return;}const r=await sb.from('daily_vocab_settings').upsert({student_id:user.id,jlpt_level:level},{onConflict:'student_id'});if(r.error)return warn(r.error);alert('保存しました。新しいレベルは翌日の単語から反映されます。');}
async function dvLoad(){if(dvLoading)return;dvLoading=true;try{let r=await sb.rpc('daily_vocab_get_or_create');if(r.error)throw r.error;dvSet=r.data;dvIndex=0;dvAnswers=[];dvQuiz=null;dvMode='cards';await dvLoadCalendar(false);render();const setting=await sb.from('daily_vocab_settings').select('jlpt_level').eq('student_id',user.id).maybeSingle();if(setting.data?.jlpt_level&&$('dvLevel'))$('dvLevel').value=setting.data.jlpt_level;}catch(e){warn(e)}finally{dvLoading=false;}}
async function dvLoadCalendar(redraw=true){const r=await sb.rpc('daily_vocab_my_calendar',{p_month:dvMonth+'-01'});if(r.error){console.warn(r.error);return;}dvCalendar=r.data||[];if(redraw)render();}
async function dvStartQuiz(){if(!dvSet)return;try{let r=await sb.rpc('daily_vocab_get_quiz',{p_set_id:dvSet.set_id});if(r.error)throw r.error;if(!Array.isArray(r.data)||r.data.length!==10)throw Error('問題数が10問ではありません');dvQuiz=r.data;dvAnswers=[];dvIndex=0;dvMode='quiz';render();}catch(e){warn(e)}}
function dvChoose(i){if(dvAnswers[dvIndex]!==undefined)return;dvAnswers[dvIndex]=i;render();}
async function dvNext(){if(dvAnswers[dvIndex]===undefined)return;if(dvIndex<9){dvIndex++;render();return;}const answers=dvQuiz.map((q,i)=>({id:q.id,choice:dvAnswers[i]}));try{let r=await sb.rpc('daily_vocab_submit',{p_set_id:dvSet.set_id,p_answers:answers});if(r.error)throw r.error;dvResult=`10問中 ${r.data.correct_count}問正解。`+(r.data.completed?'本日の学習が完了しました！':'全問正解で完了です。もう一度挑戦してください。');dvSet.completed=!!r.data.completed;dvMode='result';dvIndex=0;dvQuiz=null;dvAnswers=[];await dvLoadCalendar(false);render();}catch(e){warn(e)}}

boot().catch(warn);
</script></body></html>
